<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poker Night: stats tests</title>
<!-- Checks stats.js against the real data. Open http://localhost:8000/test.html (run the local server first).
     Read-only: it only loads data, never saves.
     Expected values were worked out separately (not with stats.js) from the data on 7 Nov 2026.
     Closed seasons never change. Checks marked LIVE use the current season or All time, so they
     go out of date after the next session; update the expected value then. -->
<style>
  body{font:14px/1.5 -apple-system,sans-serif;background:#0B0B0C;color:#EDEAE4;max-width:720px;margin:0 auto;padding:20px 16px}
  h1{font-size:20px;margin-bottom:4px}
  h2{font-size:15px;margin:18px 0 6px;color:#A39A8E}
  .row{display:flex;gap:8px;padding:3px 0;border-bottom:1px solid #2A2724}
  .ok{color:#6FBF8A}.fail{color:#E0715F}
  .live{font-size:11px;color:#C08A5B;border:1px solid #2A2724;border-radius:6px;padding:0 5px;margin-left:4px}
  #sum{font-size:16px;font-weight:600;margin:10px 0}
</style>
</head>
<body>
<h1>Stats tests</h1>
<div id="sum">Loading data…</div>
<div id="out"></div>

<script type="module" src="db.js"></script>
<script src="stats.js"></script>
<script>
let pass=0,fail=0;const out=document.getElementById('out');
function section(t){out.insertAdjacentHTML('beforeend',`<h2>${t}</h2>`);}
// Numbers match to the penny (also inside lists); anything else must be exactly equal
function equal(a,b){
  if(typeof b==='number')return typeof a==='number'&&Math.abs(a-b)<0.005;
  if(Array.isArray(b))return Array.isArray(a)&&a.length===b.length&&b.every((x,i)=>equal(a[i],x));
  return JSON.stringify(a)===JSON.stringify(b);
}
function check(label,actual,expected,live){
  const same=equal(actual,expected);
  same?pass++:fail++;
  out.insertAdjacentHTML('beforeend',`<div class="row"><span class="${same?'ok':'fail'}">${same?'✓':'✗'}</span>
    <span>${label}${live?'<span class="live">LIVE</span>':''}${same?'':` — got <b>${JSON.stringify(actual)}</b>, expected <b>${JSON.stringify(expected)}</b>`}</span></div>`);
}
const by=(list,name)=>list.find(p=>p.name===name);

async function run(){
  const D=await DB.loadAll();

  section('Chapter 2 · Season 2 (live season)');
  {const ss=selectSessions(D,'era-2',2),ps=playerStats(ss),h=headlines(ss);
   check("Ami's best session is +£64.75",by(ps,'Ami').best.pnl,64.75,1);
   check('Best session: Ami +£64.75',[h.best.player,h.best.pnl],['Ami',64.75],1);
   check('Worst session: Ari −£60',[h.worst.player,h.worst.pnl],['Ari',-60],1);
   check('Money in play £250',h.money,250,1);
   check('Ami shrunk average = 64.75 ÷ (1+3) = 16.1875',by(ps,'Ami').shrunk,16.1875,1);}

  section('Chapter 2 · Season 1 (closed)');
  {const ss=selectSessions(D,'era-2',1),ps=playerStats(ss),h=headlines(ss),rv=rivals(ss);
   check('10 sessions, 9 players',[h.sessions,h.players],[10,9]);
   check('Money in play £1,965',h.money,1965);
   check('Best session: Varunn +£126.75 (Session 8)',[h.best.player,h.best.pnl,sessionTag(h.best.session)],['Varunn',126.75,'C2 · S1 · Session 8']);
   check('Worst session: Vittu −£100 (Session 8)',[h.worst.player,h.worst.pnl,sessionTag(h.worst.session)],['Vittu',-100,'C2 · S1 · Session 8']);
   check('Standings order',ps.map(p=>p.name),['Sanj','Varunn','Vittu','Aaron','Ari','Kev','Saje','Ami','Kathiir']);
   const s=by(ps,'Sanj');
   check('Sanj: 8 sessions, total +£285.50',[s.n,s.pnlTot],[8,285.5]);
   check('Sanj: shrunk average 285.5 ÷ 11',s.shrunk,25.9545);
   check('Sanj: in profit 7, topped the table 5',[s.inProfit,s.topped],[7,5]);
   check('Sanj: best +£110 (Session 5), worst −£20',[s.best.pnl,sessionTag(s.best.session),s.worst.pnl],[110,'C2 · S1 · Session 5',-20]);
   const k=by(ps,'Kathiir');
   check('Kathiir: 4 sessions, total −£95.75, best +£8.75, worst −£65',[k.n,k.pnlTot,k.best.pnl,k.worst.pnl],[4,-95.75,8.75,-65]);
   check('Sanj rivals (3+ shared): Varunn, Vittu, Ami, Aaron, worst first',rv.Sanj.map(r=>r.opp),['Varunn','Vittu','Ami','Aaron']);
   check('Sanj vs Varunn: +£13.69 a game over 8',[+rv.Sanj[0].avg.toFixed(2),rv.Sanj[0].n],[13.69,8]);
   check('Kev (1 session) has no rivals',rv.Kev,undefined);}

  section('Chapter 1, all seasons (closed)');
  {const ss=selectSessions(D,'era-1',-1),ps=playerStats(ss),h=headlines(ss);
   check('34 sessions, 10 players',[h.sessions,h.players],[34,10]);
   check('Money in play £6,445.25',h.money,6445.25);
   check('Best session: Sanj +£89 (C1 S1 Session 5)',[h.best.player,h.best.pnl,sessionTag(h.best.session)],['Sanj',89,'C1 · S1 · Session 5']);
   check('Worst session: Ari −£82.50',[h.worst.player,h.worst.pnl],['Ari',-82.5]);
   check('Top four: Sanj, Kathiir, Kev, Ami',ps.slice(0,4).map(p=>p.name),['Sanj','Kathiir','Kev','Ami']);
   check('Sanj: 27 sessions, +£878.75, in profit 23, topped 16',[by(ps,'Sanj').n,by(ps,'Sanj').pnlTot,by(ps,'Sanj').inProfit,by(ps,'Sanj').topped],[27,878.75,23,16]);
   check('Kathiir total +£290.10 (pence survive)',by(ps,'Kathiir').pnlTot,290.1);}

  section('All time');
  {const ss=selectSessions(D,'all',-1),ps=playerStats(ss),h=headlines(ss);
   check('45 sessions',h.sessions,45,1);
   check('Sanj leads, Ari last',[ps[0].name,ps[ps.length-1].name],['Sanj','Ari'],1);
   check('Sessions are in date order',ss.every((s,i)=>i===0||ss[i-1].t<=s.t),true);
   check('C2 S1 Session 10 comes before C2 S2 Session 1 (same date)',
     ss.findIndex(s=>s.chapter===2&&s.season===1&&s.name==='Session 10')<ss.findIndex(s=>s.chapter===2&&s.season===2),true);
   const rt=runningTotals(ss);
   check("Every player's running total ends at their total PnL",ps.every(p=>Math.abs(rt[p.name].at(-1).total-p.pnlTot)<0.005),true);
   check('Every running-total line has one point per session played',ps.every(p=>rt[p.name].length===p.n),true);
   const rv=rivals(ss);
   check('Rivals only include pairs with 3+ shared sessions',Object.values(rv).flat().every(r=>r.n>=3),true);
   check("Rivals are mirror images (A vs B = −(B vs A))",Object.entries(rv).every(([a,l])=>l.every(r=>Math.abs(rv[r.opp].find(x=>x.opp===a).avg+r.avg)<1e-9)),true);
   check('Ranks run 1, 2, 3…',ps.every((p,i)=>p.rank===i+1),true);
   const sh=sharedSessions(ss,'Sanj','Saje');
   check('Sanj vs Saje: 3 shared sessions, gaps +£20.75, +£119.25, +£78.25',sh.map(x=>x.gap),[20.75,119.25,78.25],1);
   check('Sanj vs Saje: Session 5 was £20 → £130 vs £20 → £10.75',[sh[1].a.buyin,sh[1].a.final,sh[1].b.buyin,sh[1].b.final],[20,130,20,10.75]);
   check('Sanj vs Saje: average gap +£72.75',rv.Sanj.find(r=>r.opp==='Saje').avg,72.75,1);
   check("Every rival's average = the average of its shared-session gaps",Object.entries(rv).every(([a,l])=>l.every(r=>{
     const g=sharedSessions(ss,a,r.opp);return g.length===r.n&&Math.abs(g.reduce((t,x)=>t+x.gap,0)/g.length-r.avg)<0.005;})),true);
   const sp=sessionPnls(ss);
   check('Per-session points: one per session played, summing to total PnL',ps.every(p=>sp[p.name].length===p.n&&Math.abs(sp[p.name].reduce((t,x)=>t+x.pnl,0)-p.pnlTot)<0.005),true);}

  // ── Awards, real data ──
  const aw=allAwards(D);
  const find=(c,s,t)=>aw.find(a=>a.chapter===c&&a.season===s&&a.type===t);
  const who=(c,s,t)=>{const a=find(c,s,t);return a?[...a.players].sort():null;};
  section('Awards: Chapter 2 · Season 1 (locked)');
  check('Champion Sanj, Runner-up Varunn, Third Vittu, Loser Kathiir',['champion','runnerUp','third','loser'].map(t=>who(2,1,t)[0]),['Sanj','Varunn','Vittu','Kathiir']);
  check('All locked',aw.filter(a=>a.chapter===2&&a.season===1).every(a=>a.status==='locked'),true);
  check('Donation: Vittu −£100',[who(2,1,'donation'),find(2,1,'donation').value],[['Vittu'],-100]);
  check('Iron Man: Aaron and Varunn (all 10 sessions)',[who(2,1,'ironMan'),find(2,1,'ironMan').value],[['Aaron','Varunn'],10]);
  check('Comeback: Varunn, +£31.25 a game better in the second half',[who(2,1,'comeback'),find(2,1,'comeback').value],[['Varunn'],31.25]);
  check('Fall-off: Vittu',who(2,1,'falloff'),['Vittu']);
  check('Whale: Aaron, £330 bought in',[who(2,1,'whale'),find(2,1,'whale').value],[['Aaron'],330]);
  section('Awards: Chapter 1 (locked)');
  check('Sanj is Champion of all four Chapter 1 seasons',[1,2,3,4].map(s=>who(1,s,'champion')[0]),['Sanj','Sanj','Sanj','Sanj']);
  check('C1 S1 (old points season) Runner-up by PnL: Ami',who(1,1,'runnerUp'),['Ami']);
  check('C1 S2 Donation is a tie: Ami and Varunn, −£40 each',[who(1,2,'donation'),find(1,2,'donation').value],[['Ami','Varunn'],-40]);
  check('C1 S1 Whale is a tie: Aaron and Vittu, £420 each',[who(1,1,'whale'),find(1,1,'whale').value],[['Aaron','Vittu'],420]);
  check('C1 S3 Iron Man: Aaron, Kathiir, Varunn',who(1,3,'ironMan'),['Aaron','Kathiir','Varunn']);
  check('C1 S1 Comeback: Sanj, Fall-off: Ami',[who(1,1,'comeback'),who(1,1,'falloff')],[['Sanj'],['Ami']]);
  section('Awards: Chapter 2 · Season 2 (live)');
  check('Leading, not locked',aw.filter(a=>a.chapter===2&&a.season===2).every(a=>a.status==='leading'),true,1);
  check('Champion (leading): Ami',who(2,2,'champion'),['Ami'],1);
  check('No Comeback yet (needs 2+ sessions in each half)',find(2,2,'comeback'),undefined,1);
  check('Newest season first in the list',[aw[0].chapter,aw[0].season],[2,2],1);

  // ── Awards, made-up seasons to test the rules (not real data) ──
  // fake([{A:10,B:-10}, …]) = one Chapter 2 season, one entry per session, values are each player's PnL
  const fake=(...seasons)=>({activeSeasonNumber:seasons.length,eras:{'era-1':{seasons:[]},'era-2':{seasons:seasons.map((ss,k)=>({number:k+1,name:'Season '+(k+1),
    sessions:ss.map((res,i)=>({id:'x'+i,seq:i+1,name:'Session '+(i+1),date:String(i+1).padStart(2,'0')+'/01/2027',
      results:Object.entries(res).map(([player,p])=>({player,buyin:20,final:20+p}))}))}))}}});
  const typesOf=(d,s,name)=>seasonAwards(d,'era-2',s).filter(a=>a.players.includes(name)).map(a=>a.type);
  section('Award rules (made-up seasons)');
  {const d=fake([{A:10,B:10,C:0,D:-20}]);const a=seasonAwards(d,'era-2',1),get=t=>a.find(x=>x.type===t);
   check('Tied 1st: both Champion, no Runner-up, next player is Third',[get('champion').players,get('runnerUp'),get('third').players],[['A','B'],undefined,['C']]);}
  {const d=fake([{A:10,B:0,C:-10}]);
   check('3 players: bottom one is Loser, not Third',[typesOf(d,1,'C').includes('loser'),typesOf(d,1,'C').includes('third')],[true,false]);}
  {const d=fake([{A:-10,B:10,C:5},{A:-10,B:10},{A:10,B:-10,C:5},{A:10,B:-10,C:5},{A:10,B:-10}]);
   const a=seasonAwards(d,'era-2',1),get=t=>a.find(x=>x.type===t);
   check('Odd session count: middle session goes in the second half (A: −10 → +10 = +£20)',[get('comeback').players,get('comeback').value],[['A'],20]);
   check('Fall-off: B, −£20',[get('falloff').players,get('falloff').value],[['B'],-20]);
   check('Only 1 session in the first half → no Comeback/Fall-off for C',[typesOf(d,1,'C').includes('comeback'),typesOf(d,1,'C').includes('falloff')],[false,false]);}
  {const d=fake([{A:5,B:-5},{C:5,D:-5}]);
   check('Iron Man can be nobody',seasonAwards(d,'era-2',1).some(a=>a.type==='ironMan'),false);}
  {const d=fake([{A:5,B:-5}],[{A:5,B:-5}]);
   check('Older season locked, newest leading',[seasonAwards(d,'era-2',1)[0].status,seasonAwards(d,'era-2',2)[0].status],['locked','leading']);}
  {const d=fake([{A:5,B:-5,C:0}],[]);
   check('Empty season (just started) has no awards',seasonAwards(d,'era-2',2),[]);}

  document.getElementById('sum').innerHTML=fail?`<span class="fail">${fail} failed</span>, ${pass} passed`:`<span class="ok">All ${pass} passed</span>`;
}
// db.js is a module and loads after this script, so wait for its "db-ready" event
if(window.DB)run();else window.addEventListener('db-ready',run,{once:true});
</script>
</body>
</html>
