<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Poker Night</title>
<style>
:root{
  --felt:#1a472a; --gold:#c9a84c; --red:#8b2020; --blue:#2c5282;
  --green:#1a7a3e; --redt:#c0392b;
  --bg:#fff; --bg2:#f7f7f7; --bg3:#efefef; --border:#e4e4e4; --border2:#d0d0d0;
  --text:#111; --text2:#555; --text3:#8a8a8a;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#141414;--bg2:#1e1e1e;--bg3:#2a2a2a;--border:#2e2e2e;--border2:#3a3a3a;
        --text:#f0f0f0;--text2:#aaa;--text3:#6d6d6d;--green:#3fa05f;--redt:#e05a4a;}
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);max-width:640px;margin:0 auto;padding-bottom:40px}
input,select{background:var(--bg);color:var(--text);border:0.5px solid var(--border2);border-radius:8px;padding:7px 10px;font-size:13px;width:100%;font-family:inherit}
input:focus{outline:1px solid var(--felt)}
.hdr{background:var(--felt);color:var(--gold);padding:14px 16px;display:flex;align-items:center;gap:10px}
.hdr-title{font-size:17px;font-weight:500;letter-spacing:1px}
.season-bar{background:var(--bg2);padding:9px 16px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px}
.season-select{display:flex;align-items:center;gap:8px}
.season-select select{width:auto;min-width:130px;font-weight:500}
.sys-toggle{display:flex;background:var(--bg3);border-radius:8px;padding:2px}
.sys-toggle button{border:none;background:none;font-family:inherit;font-size:12px;font-weight:500;padding:6px 11px;border-radius:6px;cursor:pointer;color:var(--text2);white-space:nowrap}
.sys-toggle button.on{background:var(--felt);color:var(--gold)}
.tabs{display:flex;border-bottom:2px solid var(--felt);background:var(--bg2);overflow-x:auto}
.tab{padding:10px 14px;font-size:13px;cursor:pointer;border:none;background:none;white-space:nowrap;font-weight:500;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-2px;font-family:inherit}
.tab.on{color:var(--felt);border-bottom:2px solid var(--felt)}
.pnl{display:none;padding:1rem}
.pnl.on{display:block}
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:12px;padding:1rem 1.25rem;margin-bottom:1rem}
.stitle{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:500;flex-shrink:0}
.metric{background:var(--bg2);border-radius:8px;padding:10px 12px}
.metric-lbl{font-size:11px;color:var(--text3);margin-bottom:4px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pos{color:var(--green)}.neg{color:var(--redt)}.neu{color:var(--text3)}
.note{font-size:12px;color:var(--text3);line-height:1.6;margin-bottom:12px}
table{border-collapse:collapse;width:100%}
.btn{background:var(--felt);color:var(--gold);border:none;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;font-weight:500;font-family:inherit}
.btn-blue{background:var(--blue);color:#bee3f8}
.btn-ghost{background:var(--bg2);color:var(--text);border:0.5px solid var(--border2);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.btn-red{background:var(--red);color:#fcd;border:none;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit}
.btn-sm{padding:4px 10px;font-size:12px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;border-radius:6px;cursor:pointer;border:0.5px solid var(--border2);background:var(--bg2);color:var(--text);font-family:inherit}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--felt);color:var(--gold);padding:8px 20px;border-radius:20px;font-size:13px;font-weight:500;z-index:999;pointer-events:none;opacity:0;transition:opacity .3s}
.toast.on{opacity:1}
.loading{padding:3rem;text-align:center;color:var(--text3);font-size:14px}
.warn-box{display:flex;align-items:center;gap:6px;margin-bottom:12px;padding:8px 12px;background:var(--bg2);border-radius:8px;font-size:12px;color:var(--text2)}
.confirm-box{border:0.5px solid var(--red);border-radius:12px;padding:1rem 1.25rem;margin-bottom:12px}
.badge{display:inline-block;background:var(--felt);color:var(--gold);border-radius:6px;padding:3px 10px;font-size:13px;font-weight:500;min-width:32px;text-align:center}
.win-banner{border:1px solid var(--gold);border-radius:8px;padding:10px 14px;margin-bottom:12px;text-align:center;font-size:14px}
.pill{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--bg3);color:var(--text3);font-weight:500}
</style>
</head>
<body>

<div class="tabs" id="tabs">

  <button class="tab" onclick="goTab('hist',this)">History</button>
  <button class="tab" onclick="goTab('stats',this)">Stats</button>

<div class="pnl on" id="pnl-lb"><div class="loading">Loading...</div></div>
<div class="pnl" id="pnl-scorer"></div>

<div class="toast" id="toast"></div>

<script>
// ══════════════ SUPABASE ══════════════
const SB_URL="https://toqiyymioqjhebyyqufn.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvcWl5eW1pb3FqaGVieXlxdWZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5NDY2NzQsImV4cCI6MjA5NjUyMjY3NH0.b5C6gryuWkwN4h6QAvtApIbvMlZ7X3uSw-Jr7uIVWHo";
const H={"Content-Type":"application/json","apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY};

async function dbLoad(){
  const r=await fetch(`${SB_URL}/rest/v1/sessions?select=id,data&order=id.asc&limit=1`,{headers:H});
  const rows=await r.json();
  if(!rows.length)return null;
  return {id:rows[0].id,data:rows[0].data};
}
async function dbSave(id,data){
  await fetch(`${SB_URL}/rest/v1/sessions?id=eq.${id}`,{method:"PATCH",headers:H,
    body:JSON.stringify({data,updated_at:new Date().toISOString()})});
}

// ══════════════ SEASON 1 SEED (canonical 10 sessions) ══════════════
const SEASON1=[
 {name:"Session 1",date:"16/04/2026",results:[
  {player:"Kathiir",buyin:20,final:61.10},{player:"Varunn",buyin:20,final:41.70},
  {player:"Ami",buyin:40,final:50.60},{player:"Sanj",buyin:60,final:27.00},{player:"Aaron",buyin:60,final:20.00}]},
 {name:"Session 2",date:"26/04/2026",results:[
  {player:"Varunn",buyin:20,final:29.75},{player:"Ami",buyin:40,final:61.00},
  {player:"Sanj",buyin:20,final:21.75},{player:"Aaron",buyin:20,final:15.50},{player:"Kathiir",buyin:40,final:12.00}]},
 {name:"Session 3",date:"16/05/2026",results:[
  {player:"Ami",buyin:20,final:54.25},{player:"Vittu",buyin:40,final:62.75},
  {player:"Sanj",buyin:20,final:17.00},{player:"Varunn",buyin:40,final:16.50},{player:"Aaron",buyin:40,final:9.75}]},
 {name:"Session 4",date:"23/05/2026",results:[

  {player:"Kathiir",buyin:40,final:23.50},{player:"Vittu",buyin:60,final:23.50}]},
 {name:"Session 5",date:"06/06/2026",results:[
  {player:"Kathiir",buyin:20,final:97.00},{player:"Sanj",buyin:40,final:129.00},
  {player:"Varunn",buyin:40,final:29.00},{player:"Ami",buyin:60,final:22.75},

 {name:"Session 6",date:"13/06/2026",results:[

 {name:"Session 7",date:"14/06/2026",results:[

  {player:"Ami",buyin:20,final:20.75},{player:"Vittu",buyin:80,final:28.50},{player:"Aaron",buyin:60,final:12.00}]},
 {name:"Session 8",date:"20/06/2026",results:[
  {player:"Sanj",buyin:20,final:80.00},{player:"Varunn",buyin:20,final:41.25},
  {player:"Ami",buyin:40,final:46.00},{player:"Vittu",buyin:40,final:13.25},{player:"Aaron",buyin:80,final:20.00}]},
 {name:"Session 9",date:"24/06/2026",results:[
  {player:"Vittu",buyin:20,final:45.00},{player:"Sanj",buyin:40,final:96.25},
  {player:"Varunn",buyin:20,final:27.25},{player:"Aaron",buyin:20,final:25.25},
  {player:"Ami",buyin:40,final:26.25},{player:"Kathiir",buyin:100,final:19.75}]},
 {name:"Session 10",date:"03/07/2026",results:[
  {player:"Sanj",buyin:20,final:84.00},{player:"Aaron",buyin:20,final:45.75},
  {player:"Kev",buyin:60,final:40.30},{player:"Varunn",buyin:60,final:18.50},{player:"Vittu",buyin:40,final:11.75}]}
];

const K=3;
const KNOWN=["Kathiir","Varunn","Ami","Aaron","Sanj","Vittu","Kev"];
const CB=['#1a472a','#2980b9','#8b2020','#6b3fa0','#b5551a','#1a5276','#7a5c1e','#2d6a4f','#9c4221'];
const CF=['#a8e6c0','#bee3f8','#fcd5d5','#e8d5f8','#fde8d5','#d5eef8','#f5e6c0','#c5e8d5','#f8d5c0'];

// ══════════════ SCORING ══════════════
const BKT=[[0,0],[0.5,5],[0.8,8],[1.0,10],[1.2,13],[1.5,16],[2.0,19],[2.5,22],[3.0,25],[4.0,30],[5.0,35]];
function interpPts(m){if(m<=0)return 0;if(m>=5)return 35+(m-5)*5;
  for(let i=1;i<BKT.length;i++){const[lm,lp]=BKT[i-1],[hm,hp]=BKT[i];if(m<=hm)return lp+((m-lm)/(hm-lm))*(hp-lp);}return 35;}
function rebuyMult(b){if(b<=40)return 1;if(b<=60)return .9;if(b<=80)return .5;if(b<=100)return .25;return .25*Math.pow(.5,Math.floor((b-100)/20)+1);}
function oldPts(b,f){return Math.round(interpPts(b>0?f/b:0)*rebuyMult(b));}
function pnl(r){return r.final-r.buyin;}

// ══════════════ STATE ══════════════
let DB_ID=null;
let seasons=[];       // [{name, system, sessions:[]}]
let curSeason=0;      // index
let SYS='pnl';        // display system for archived seasons
let TAB='lb';
let formActive=null;
let scorerPlayers=[], scorerRows={}, scorerName="", scorerResult=null;
let editIdx=null, editData=null, deleteIdx=null;

// ══════════════ INIT ══════════════
async function init(){
  try{
    const row=await dbLoad();
    if(row){
      DB_ID=row.id;
      const d=row.data;
      // Detect format: new = array of seasons (objects with .sessions); old flat = array of sessions (objects with .results)
      if(Array.isArray(d) && d.length && d[0] && d[0].sessions!==undefined){
        seasons=d; // already new format
      } else {
        // empty or old flat format -> seed fresh season structure
        seasons=[
          {name:"Season 1",system:"old",sessions:SEASON1},
          {name:"Season 2",system:"pnl",sessions:[]}
        ];
        await dbSave(DB_ID,seasons);
      }
    } else {
      seasons=[
        {name:"Season 1",system:"old",sessions:SEASON1},
        {name:"Season 2",system:"pnl",sessions:[]}
      ];
    }
  }catch(e){
    seasons=[{name:"Season 1",system:"old",sessions:SEASON1},{name:"Season 2",system:"pnl",sessions:[]}];
  }
  curSeason=seasons.length-1;         // default to newest (active) season
  SYS = seasons[curSeason].system;
  renderSeasonBar();
  render();
}

async function persist(){
  if(DB_ID!==null){try{await dbSave(DB_ID,seasons);}catch(e){toast("Save failed — check connection");}}
}

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200);}

// ══════════════ SEASON BAR ══════════════
function renderSeasonBar(){
  const allTime=isAllTime();
  const s=allTime?null:seasons[curSeason];
  const isArchived = s && s.system==="old";
  let html=`<div class="season-select">
    <select onchange="switchSeason(this.value)">
      <option value="-1" ${allTime?'selected':''}>★ All time</option>
      ${seasons.map((se,i)=>`<option value="${i}" ${i===curSeason?'selected':''}>${se.name}${i===seasons.length-1?' (current)':''}</option>`).join('')}
    </select>
    <button class="btn-ghost btn-sm" onclick="newSeason()">+ New season</button>
  </div>`;
  // Only Season 1 (old system) gets the comparison toggle
  if(isArchived){
    html+=`<div class="sys-toggle">
      <button class="${SYS==='pnl'?'on':''}" onclick="setSys('pnl')">Shrunk PnL</button>
      <button class="${SYS==='old'?'on':''}" onclick="setSys('old')">Old points</button>
    </div>`;
  }
  document.getElementById('season-bar').innerHTML=html;
}

function switchSeason(i){
  curSeason=+i;
  SYS = (isAllTime()||seasons[curSeason].system!=="old") ? "pnl" : SYS;
  formActive=null; scorerResult=null; editIdx=null; deleteIdx=null;
  renderSeasonBar(); render();
}
function setSys(s){SYS=s;renderSeasonBar();render();}

async function newSeason(){
  const n=seasons.length+1;
  seasons.push({name:`Season ${n}`,system:"pnl",sessions:[]});
  curSeason=seasons.length-1; SYS="pnl";
  await persist();
  renderSeasonBar(); render();
  toast(`Season ${n} created`);
}

function goTab(id,el){
  TAB=id;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.querySelectorAll('.pnl').forEach(p=>p.classList.remove('on'));
  el.classList.add('on');
  document.getElementById('pnl-'+id).classList.add('on');
  render();
}

// ══════════════ HELPERS ══════════════
function isAllTime(){return curSeason===-1;}
function curSessions(){
  if(isAllTime()){
    // pool every session from every season, tagged with season name
    return seasons.flatMap(se=>se.sessions.map(s=>({...s,_season:se.name})));
  }
  return seasons[curSeason].sessions;
}
function isActiveSeason(){return !isAllTime() && curSeason===seasons.length-1;}
function avIdx(n){const i=KNOWN.indexOf(n);return i<0?(hashName(n)%CB.length):i;}
function hashName(n){let h=0;for(let i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))>>>0;return h;}
function av(n,s=28){const i=avIdx(n);return `<div class="av" style="width:${s}px;height:${s}px;font-size:${Math.round(s*.38)}px;background:${CB[i]};color:${CF[i]}">${n.slice(0,2).toUpperCase()}</div>`;}
function money(v,dp=2){const s=v>=0?'+':'−';return `${s}£${Math.abs(v).toFixed(dp)}`;}
function cls(v){return v>0.004?'pos':v<-0.004?'neg':'neu';}
function round50(v){return Math.round(v*2)/2;}

function buildStats(){
  const m={};
  curSessions().forEach(s=>{
    const ranked=s.results.map(r=>({...r,_p:pnl(r),_o:oldPts(r.buyin,r.final)}));
    const sortP=[...ranked].sort((a,b)=>b._p-a._p);
    const sortO=[...ranked].sort((a,b)=>b._o-a._o);
    ranked.forEach(r=>{
      if(!m[r.player])m[r.player]={name:r.player,n:0,pnlTot:0,oldTot:0,winsP:0,winsO:0,rows:[],in:0,out:0};
      const e=m[r.player];e.n++;e.pnlTot+=r._p;e.oldTot+=r._o;e.in+=r.buyin;e.out+=r.final;
      e.rows.push({sname:s.name,buyin:r.buyin,final:r.final,p:r._p,o:r._o});
    });
    if(sortP[0])m[sortP[0].player].winsP++;
    if(sortO[0])m[sortO[0].player].winsO++;
  });
  return Object.values(m);
}
function ranked(){
  const all=buildStats();const total=curSessions().length;
  all.forEach(p=>{p.shrunk=p.pnlTot/(p.n+K);p.rawAvg=p.pnlTot/p.n;p.oldAvg=p.oldTot/p.n;
    p.metric=SYS==='pnl'?p.shrunk:p.oldAvg;p.seasonTotal=total;});
  return all.sort((a,b)=>b.metric-a.metric);
}

// ══════════════ RENDER DISPATCH ══════════════
function render(){
  if(TAB==='lb')renderLB();
  if(TAB==='scorer')renderScorer();
  if(TAB==='hist')renderHist();
  if(TAB==='stats')renderStats();
  if(TAB==='rules')renderRules();
}

// ══════════════ LEADERBOARD ══════════════
function renderLB(){
  const total=curSessions().length;
  if(total===0){
    document.getElementById('pnl-lb').innerHTML=`<div class="card"><div class="note" style="margin:0;text-align:center;padding:1rem 0">No sessions yet in ${seasons[curSeason].name}. Add one from the <strong>Session</strong> tab to get started.</div></div>`;
    return;
  }
  const all=ranked();const isPnl=SYS==='pnl';
  const maxAbs=Math.max(...all.map(p=>Math.abs(p.metric)),1);
  const allTime=isAllTime();
  let html=`<div class="card">
    <div class="stitle">${allTime?'All-time standings — shrunk avg PnL':(isPnl?'Standings — shrunk avg PnL':'Standings — avg points (old system)')}</div>
    <div class="note">${isPnl
      ? `Ranked by total PnL ÷ (sessions + ${K})${allTime?', pooled across every season':''}. A player with few games sits closer to £0 until they've proven otherwise.`
      : `Ranked by average bracket points. Scores floor at 0.`}</div>`;
  all.forEach((p,i)=>{
    const medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
    const headline=isPnl?money(round50(p.metric),2):p.metric.toFixed(1)+' pts';
    const sub=isPnl?`${p.n}/${total} played · ${money(p.pnlTot,2)} total`:`${p.n}/${total} played · ${p.oldTot} total pts`;
    html+=`<div style="display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:0.5px solid var(--border)">
      <span style="width:22px;text-align:center;font-size:14px">${medal}</span>${av(p.name)}
      <div style="flex:1;min-width:0">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <span style="font-size:14px;font-weight:500">${p.name}</span>
          <span style="font-size:15px;font-weight:600;${isPnl?'':'color:var(--felt)'}" class="${isPnl?cls(p.metric):''}">${headline}</span>
        </div>
        <div style="font-size:11px;color:var(--text3);margin-top:2px">${sub}</div>
      </div></div>`;
  });
  html+=`</div>`;
  html+=`<div class="card"><div class="stitle">${isPnl?'Shrunk avg PnL per session':'Avg points per session'}</div>${isPnl?barCentred(all,maxAbs):barSimple(all,maxAbs)}</div>`;
  html+=`<div class="card"><div class="stitle">Form — ${isPnl?'PnL':'points'} per session${allTime?' (all seasons)':''}</div>${formChart(all,isPnl)}
    <div style="display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:10px">
      ${all.map(p=>{const c=CB[avIdx(p.name)];const act=formActive===p.name;const fade=formActive&&!act;
        return `<button onclick="toggleForm('${p.name}')" style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;border:none;padding:4px 8px;border-radius:6px;font-family:inherit;background:${act?'var(--bg2)':'transparent'};opacity:${fade?0.3:1};color:var(--text)">
          <span style="width:14px;height:${act?4:3}px;border-radius:2px;background:${c};display:inline-block"></span>${p.name}</button>`;}).join('')}
    </div>${formActive?`<div style="font-size:11px;color:var(--text3);margin-top:6px;text-align:center">Tap ${formActive} again to reset</div>`:''}</div>`;
  document.getElementById('pnl-lb').innerHTML=html;
}
function toggleForm(n){formActive=formActive===n?null:n;renderLB();}

function barCentred(all,maxAbs){
  const W=340,rowH=34,padT=18,padB=8,labelW=64;const H=padT+all.length*rowH+padB;
  const zone=W-labelW-10;const cx=labelW+zone/2;const scale=(zone/2-30)/maxAbs;
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">`;
  s+=`<text x="${cx}" y="11" font-size="9" fill="var(--text3)" text-anchor="middle">£0</text>`;
  s+=`<line x1="${cx}" x2="${cx}" y1="${padT-4}" y2="${H-padB}" stroke="var(--border2)" stroke-width="1"/>`;
  all.forEach((p,i)=>{const y=padT+i*rowH;const v=p.metric;const w=Math.abs(v)*scale;const x=v>=0?cx:cx-w;
    const col=v>=0?'#1a7a3e':'#c0392b';
    // name label pinned to far left, always clear of the plot zone
    s+=`<text x="4" y="${y+15}" font-size="10.5" fill="var(--text2)" text-anchor="start">${p.name.slice(0,7)}</text>`;
    s+=`<rect x="${x}" y="${y+5}" width="${Math.max(w,1.5)}" height="15" rx="3" fill="${col}"/>`;
    // value label sits just past the bar end, on the outside
    const tx=v>=0?cx+w+4:cx-w-4;const anc=v>=0?'start':'end';
    s+=`<text x="${tx}" y="${y+16}" font-size="10" font-weight="600" fill="${col}" text-anchor="${anc}">${money(v,2)}</text>`;});
  return s+`</svg>`;
}
function barSimple(all,max){
  const W=320,rowH=30,padT=8,padB=8,labelW=52;const H=padT+all.length*rowH+padB;
  const zone=W-labelW-48;const scale=zone/max;
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">`;
  all.forEach((p,i)=>{const y=padT+i*rowH;const w=p.metric*scale;
    s+=`<text x="${labelW-6}" y="${y+15}" font-size="11" fill="var(--text2)" text-anchor="end">${p.name.slice(0,6)}</text>`;
    s+=`<rect x="${labelW}" y="${y+5}" width="${Math.max(w,1.5)}" height="15" rx="3" fill="#1a472a"/>`;
    s+=`<text x="${labelW+w+5}" y="${y+16}" font-size="10" font-weight="600" fill="var(--text2)">${p.metric.toFixed(1)}</text>`;});
  return s+`</svg>`;
}
function formChart(all,isPnl){
  const SS=curSessions();const W=320,H=210,padL=34,padR=10,padT=10,padB=26;
  const iW=W-padL-padR,iH=H-padT-padB;const n=SS.length;
  const vals=SS.flatMap(s=>s.results.map(r=>isPnl?pnl(r):oldPts(r.buyin,r.final)));
  let lo=Math.min(...vals,0),hi=Math.max(...vals,1);const span=hi-lo||1;lo-=span*0.06;hi+=span*0.06;
  const toX=i=>padL+i*(iW/Math.max(n-1,1));const toY=v=>padT+iH-((v-lo)/(hi-lo))*iH;
  let ticks=isPnl?[-80,-40,0,40,80,120]:[0,10,20,30];ticks=ticks.filter(t=>t>=lo&&t<=hi);
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">`;
  ticks.forEach(t=>{const z=t===0;
    s+=`<line x1="${padL}" x2="${W-padR}" y1="${toY(t)}" y2="${toY(t)}" stroke="${z?'var(--border2)':'var(--border)'}" stroke-width="${z?1:0.5}" ${z?'':'stroke-dasharray="3,3"'}/>`;
    s+=`<text x="${padL-5}" y="${toY(t)+3.5}" font-size="8.5" fill="var(--text3)" text-anchor="end">${isPnl?(t<0?'−£'+Math.abs(t):'£'+t):t}</text>`;});
  SS.forEach((_,i)=>{if(n<=1){s+=`<text x="${toX(i)}" y="${H-7}" font-size="8.5" fill="var(--text3)" text-anchor="middle">S${i+1}</text>`;}
    else s+=`<text x="${toX(i)}" y="${H-7}" font-size="8.5" fill="var(--text3)" text-anchor="middle">S${i+1}</text>`;});
  all.forEach(p=>{const c=CB[avIdx(p.name)];const act=formActive===p.name;const fade=formActive&&!act;
    const pts=SS.map(s2=>{const r=s2.results.find(x=>x.player===p.name);return r?(isPnl?pnl(r):oldPts(r.buyin,r.final)):null;});
    const segs=[];let seg=[];pts.forEach((v,i)=>{if(v!==null)seg.push([i,v]);else{if(seg.length>=2)segs.push(seg);seg=[];}});
    if(seg.length>=2)segs.push(seg);
    // also plot single isolated points as dots
    const dots=pts.map((v,i)=>v!==null?[i,v]:null).filter(Boolean);
    s+=`<g style="opacity:${fade?0.09:1}">`;
    segs.forEach(sg=>{const d=sg.map(([i,v],j)=>`${j===0?'M':'L'}${toX(i).toFixed(1)},${toY(v).toFixed(1)}`).join(' ');
      s+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="${act?2.4:1.4}" stroke-linejoin="round" stroke-linecap="round"/>`;});
    dots.forEach(([i,v])=>{s+=`<circle cx="${toX(i).toFixed(1)}" cy="${toY(v).toFixed(1)}" r="${act?3.6:2.4}" fill="${c}"/>`;});
    s+=`</g>`;});
  return s+`</svg>`;
}

async function saveSession(){

        <div style="display:flex;justify-content:space-between;align-items:center">

          <span style="font-size:18px;font-weight:600" class="${cls(p.pnlTot)}">${money(p.pnlTot,2)}</span></div></div>

        <div style="display:flex;justify-content:space-between;align-items:center">

  });

  html+=`<div class="card"><div class="stitle">Head-to-head</div>
    <div class="note">Average ${isPnl?'PnL':'points'} difference in shared sessions. Green = you did better.</div>
    <div style="overflow-x:auto"><table style="table-layout:fixed;min-width:300px"><thead><tr><td style="width:40px"></td>
      ${names.map(n=>`<th style="padding:4px 1px;font-size:9px;color:var(--text3);font-weight:500;text-align:center;border-bottom:0.5px solid var(--border)"><div style="display:flex;flex-direction:column;align-items:center;gap:2px"><span style="width:7px;height:7px;border-radius:50%;background:${CB[avIdx(n)]}"></span>${n.slice(0,3)}</div></th>`).join('')}</tr></thead><tbody>
      ${names.map(row=>`<tr><td style="padding:4px 2px;font-size:10px;font-weight:500;border-bottom:0.5px solid var(--border)"><div style="display:flex;align-items:center;gap:3px"><span style="width:7px;height:7px;border-radius:50%;background:${CB[avIdx(row)]};flex-shrink:0"></span>${row.slice(0,3)}</div></td>
        ${names.map(col=>{if(row===col)return `<td style="padding:4px 1px;text-align:center;background:var(--bg2);border-bottom:0.5px solid var(--border)"><span style="font-size:9px;color:var(--text3)">—</span></td>`;
          const d=h[row]?.[col];if(!d||d.n===0)return `<td style="padding:4px 1px;text-align:center;border-bottom:0.5px solid var(--border)"><span style="font-size:9px;color:var(--text3)">—</span></td>`;
          const diff=(d.mine-d.theirs)/d.n;const win=diff>0;const txt=isPnl?(win?'+':'−')+'£'+Math.abs(diff).toFixed(0):(win?'+':'')+diff.toFixed(1);
          return `<td style="padding:4px 1px;text-align:center;background:${win?'rgba(26,122,62,.10)':'rgba(192,57,43,.10)'};border-bottom:0.5px solid var(--border)"><div style="font-size:10px;font-weight:600" class="${win?'pos':'neg'}">${txt}</div><div style="font-size:8px;color:var(--text3)">${d.n}g</div></td>`;}).join('')}</tr>`).join('')}
    </tbody></table></div></div>`;
  // Records
  let bestS={v:-1e9},worstS={v:1e9},bigPot={v:0},seconds={};
  curSessions().forEach(s=>{const rs=s.results.map(r=>({...r,p:pnl(r),o:oldPts(r.buyin,r.final)}));
    const sorted=[...rs].sort((a,b)=>isPnl?b.p-a.p:b.o-a.o);if(sorted[1])seconds[sorted[1].player]=(seconds[sorted[1].player]||0)+1;
    const pot=rs.reduce((a,r)=>a+r.buyin,0);if(pot>bigPot.v)bigPot={v:pot,name:(s._season?s._season+' ':'')+s.name};
    rs.forEach(r=>{const v=isPnl?r.p:r.o;const tag=(s._season?s._season+' ':'');if(v>bestS.v)bestS={v,player:r.player,sname:tag+s.name,buyin:r.buyin,final:r.final};if(v<worstS.v)worstS={v,player:r.player,sname:tag+s.name,buyin:r.buyin,final:r.final};});});
  const ms=Object.entries(seconds).sort((a,b)=>b[1]-a[1])[0];const totalIn=curSessions().flatMap(s=>s.results).reduce((a,r)=>a+r.buyin,0);
  const facts=[
    {i:'🏆',l:'Best single session',v:isPnl?money(bestS.v,2):bestS.v+' pts',s:`${bestS.player} · ${bestS.sname} · £${bestS.buyin}→£${bestS.final.toFixed(2)}`},
    {i:'💀',l:'Worst single session',v:isPnl?money(worstS.v,2):worstS.v+' pts',s:`${worstS.player} · ${worstS.sname} · £${worstS.buyin}→£${worstS.final.toFixed(2)}`},
    {i:'🥈',l:'Most runner-up finishes',v:ms?ms[0]:'—',s:`${ms?ms[1]:0} second places`},
    {i:'💸',l:'Most expensive session',v:`£${bigPot.v} in play`,s:bigPot.name||'—'},
    {i:'🏦',l:'Total money this season',v:`£${totalIn}`,s:`over ${curSessions().length} sessions`},
  ];
  html+=`<div class="card"><div class="stitle">${isAllTime()?'All-time records':seasons[curSeason].name+' records'}</div>
    ${facts.map(f=>`<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:0.5px solid var(--border)"><span style="font-size:20px">${f.i}</span>
      <div style="flex:1;min-width:0"><div style="font-size:11px;color:var(--text3)">${f.l}</div><div style="font-size:15px;font-weight:600">${f.v}</div><div style="font-size:11px;color:var(--text3);margin-top:1px">${f.s}</div></div></div>`).join('')}</div>`;
  el.innerHTML=html;
}

// ══════════════ RULES ══════════════
function renderRules(){
  const el=document.getElementById('pnl-rules');const isPnl=SYS==='pnl';let html='';
  if(isPnl){
    html=`<div class="card"><div class="stitle">How scoring works</div>
      <p style="font-size:13px;color:var(--text2);line-height:1.75">Your score for a session is simply <strong>final chips − total buy-in</strong>. No multipliers, no brackets, no rebuy penalties. Win money, score positive. Lose money, score negative.</p></div>
    <div class="card"><div class="stitle">The standings</div>
      <p style="font-size:13px;color:var(--text2);line-height:1.75">Ranked by <strong>total PnL ÷ (sessions played + ${K})</strong>.</p>
      <div style="margin-top:10px;padding:10px 12px;background:var(--bg2);border-radius:8px;font-size:13px;color:var(--text2);line-height:1.75">Everyone is treated as though they'd also played ${K} break-even sessions. Play once and those ${K} imaginary sessions dominate, so you sit near £0. Play the whole season and they barely matter. This stops someone winning big on their debut and topping the table above a season-long grinder.</div>
      <div style="margin-top:10px;padding:10px 12px;background:var(--bg2);border-radius:8px;font-size:13px;color:var(--text2);line-height:1.75"><strong style="color:var(--text)">Example.</strong> +£348.25 across 10 sessions → 348.25 ÷ 13 = <strong style="color:var(--text)">+£26.79</strong>. One session of −£20 → −20 ÷ 4 = <strong style="color:var(--text)">−£5.00</strong>.</div></div>
    <div class="card"><div class="stitle">Buy-ins and rebuys</div>
      <p style="font-size:13px;color:var(--text2);line-height:1.75">Everyone starts with <strong>£20</strong>. If you bust, rebuy for any amount between <strong>£20</strong> and the <strong>largest stack at the table</strong>.</p>
      <div style="margin-top:10px;padding:10px 12px;background:var(--bg2);border-radius:8px;font-size:12px;color:var(--text3);line-height:1.7">Buying in for more than the biggest stack is pointless — the excess can never be won or lost. The table sets the limit; no house rule needed.</div></div>`;
  } else {
    const brackets=[[0,'0x'],[5,'0.5x'],[8,'0.8x'],[10,'1x'],[13,'1.2x'],[16,'1.5x'],[19,'2x'],[22,'2.5x'],[25,'3x'],[30,'4x'],[35,'5x+']];
    const rb=[['0 rebuys','£20','×1.0'],['1 rebuy','£40','×1.0'],['2 rebuys','£60','×0.9'],['3 rebuys','£80','×0.5'],['4 rebuys','£100','×0.25'],['5+ rebuys','£120+','halves each time']];
    html=`<div class="card"><div class="stitle">Old system — reference only</div>
      <p style="font-size:13px;color:var(--text2);line-height:1.75">Multiplier = final ÷ buy-in, mapped to bracket points with interpolation, then multiplied by a rebuy penalty. Retired after Season 1.</p></div>
    <div class="card"><div class="stitle">Multiplier → points</div>
      ${brackets.map(([p,m])=>`<div style="display:flex;align-items:center;gap:12px;padding:5px 0;border-bottom:0.5px solid var(--border)"><span style="width:38px;font-size:12px;color:var(--text3);font-weight:500">${m}</span><span class="badge">${m==='5x+'?'∞':p}</span></div>`).join('')}</div>
    <div class="card"><div class="stitle">Rebuy penalty</div>
      ${rb.map(([n,s,m])=>`<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:0.5px solid var(--border)"><span style="font-size:12px;min-width:78px">${n}</span><span style="font-size:11px;color:var(--text3);min-width:44px">${s}</span><span style="font-size:13px;font-weight:500">${m}</span></div>`).join('')}</div>
    <div class="card" style="border-color:var(--redt)"><div class="stitle" style="color:var(--redt)">Why it was retired</div>
      <p style="font-size:13px;color:var(--text2);line-height:1.75">Points floor at zero. Kathiir's Session 9 — £100 in, £19.75 out, <strong>−£80.25</strong> — scored <strong>0 points</strong>, indistinguishable from a mildly bad night. Sixteen hand-tuned constants doing what PnL does with none.</p></div>`;
  }
  el.innerHTML=html;
}

init();
</script>
