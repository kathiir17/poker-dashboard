<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0C">
<title>Family Poker Night</title>
<!-- Installable as a full-screen home-screen app -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Poker Night">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Archivo (with its width axis, for the expanded titles) and Inter -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ══════════════ DESIGN TOKENS ══════════════
   The one palette for the whole app. Use these variables, never raw colours. */
:root{
  color-scheme:dark;
  --base:#0B0B0C;     /* page background */
  --card:#141416;     /* cards */
  --raised:#1D1C1F;   /* inputs, chips, insets inside cards */
  --border:#2A2724;
  --copper:#C08A5B;   /* accent: primary buttons, active states */
  --link:#D9A273;     /* text links */
  --gold:#DDB872;     /* 1st place */
  --ivory:#ECE6DA;
  --silver:#C5CCD6;   /* 2nd place */
  --text:#EDEAE4;
  --muted:#A39A8E;
  --up:#6FBF8A;
  --down:#E0715F;
  --display:'Archivo',-apple-system,'Helvetica Neue',Arial,sans-serif;
  --body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --r-card:18px;
  --r-ctl:12px;
  --nav-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}  /* so el.hidden always wins over inline display:flex */
body{font-family:var(--body);font-size:14px;line-height:1.45;background:var(--base);color:var(--text);max-width:640px;margin:0 auto;-webkit-font-smoothing:antialiased;
  /* clear the notch at the top (full-screen app) and the bottom bar + home indicator at the bottom */
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px)}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:-3px}

/* ── Type ── */
.title{font-family:var(--display);font-weight:800;font-stretch:125%;text-transform:uppercase;letter-spacing:.01em;line-height:1}
.h2{font-family:var(--display);font-weight:700;font-size:17px;color:var(--text);margin-bottom:4px}
.money{font-family:var(--display);font-weight:700;font-stretch:112%;font-variant-numeric:tabular-nums;white-space:nowrap}
.sub{font-size:12px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:14px}
.prose{font-size:14px;color:var(--muted);line-height:1.7}
.prose strong,.note strong{color:var(--text);font-weight:600}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--muted)}
.accent{color:var(--copper)}

/* ── Header and Chapter / Season pickers ── */
.hdr{padding:24px 16px 16px}
.hdr .title{font-size:clamp(18px,5.8vw,30px);white-space:nowrap;color:var(--text)}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;background:none;border:1px solid transparent;color:var(--muted);cursor:pointer}
.icon-btn:hover{color:var(--text);border-color:var(--border)}
.icon-btn svg.i{width:20px;height:20px}
.season-bar{padding:0 16px 4px;position:relative;z-index:60}  /* above the dropdown dimmer */
.pickers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* A picker: a box showing the current choice; tapping it drops a themed list down beneath it. */
.picker-wrap{position:relative;min-width:0}
.picker{position:relative;display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:10px 38px 11px 14px;cursor:pointer}
.picker .lbl{font-size:12px;color:var(--muted)}
.picker .val{font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.picker .chev{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);transition:transform .15s}
.picker[aria-expanded="true"]{border-color:var(--copper)}
.picker[aria-expanded="true"] .chev{transform:translateY(-50%) rotate(180deg)}
.picker:disabled{cursor:default;padding-right:14px}
.picker:disabled .val{color:var(--muted)}
.dropdown{position:absolute;top:calc(100% + 8px);left:0;min-width:100%;width:max-content;max-width:min(300px,calc(100vw - 32px));background:var(--card);border:1px solid var(--border);border-radius:18px;padding:6px;box-shadow:0 18px 40px rgba(0,0,0,.55);animation:drop .14s ease-out}
.dropdown.right{left:auto;right:0}
@keyframes drop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.dd-item{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;border-radius:12px;padding:12px;font-size:16px;color:var(--muted);text-align:left;cursor:pointer}
.dd-item:hover,.dd-item:focus-visible{background:var(--raised);color:var(--text);outline:none}
.dd-item.on{color:var(--text);font-weight:500}
.dd-item .tick{margin-left:auto;color:var(--copper)}
.dd-item .tag-cur{font-size:11px;font-weight:600;color:var(--copper);border:1px solid var(--border);border-radius:999px;padding:1px 8px}
.dd-sep{height:1px;background:var(--border);margin:6px 8px}
.dd-item.action{color:var(--link);font-weight:600}
.dd-item.action svg.i{width:18px;height:18px}
.dd-dim{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.45);animation:fade .14s ease-out}
@keyframes fade{from{opacity:0}}
.season-bar .seg{margin-top:10px;display:inline-flex}
/* ── Confirmation dialog (confirmSheet) ── */
.sheet-bg{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){.sheet-bg{align-items:center}}
.sheet{width:100%;max-width:440px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:22px}
.sheet h2{font-family:var(--display);font-weight:700;font-size:20px;margin-bottom:8px}
.sheet p{color:var(--muted);line-height:1.6;margin-bottom:20px}
.sheet .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.seg{display:flex;background:var(--card);border:1px solid var(--border);border-radius:var(--r-ctl);padding:3px}
.seg button{border:none;background:none;font-size:13px;font-weight:500;padding:7px 12px;border-radius:9px;cursor:pointer;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--raised);color:var(--text);box-shadow:inset 0 0 0 1px var(--copper)}

/* ── Bottom navigation bar ── */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:640px;margin:0 auto;height:var(--nav-h);display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;color:var(--muted);font-size:11px;font-weight:500;cursor:pointer;padding:8px 0}
.nav-btn svg.i{width:22px;height:22px}
.nav-btn.on{color:var(--copper)}
.nav-add{justify-self:center;width:56px;height:56px;border-radius:50%;background:var(--copper);color:var(--base);border:4px solid var(--base);margin-top:-22px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.nav-add svg.i{width:26px;height:26px;stroke-width:2.25}
.nav-add.on,.nav-add:hover{background:var(--link)}
/* ── More list and back link ── */
.list-btn{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;border-bottom:1px solid var(--border);padding:14px 0;font-size:15px;text-align:left;cursor:pointer}
.list-btn:last-child{border-bottom:none}
.list-btn .ic{width:36px;height:36px;border-radius:10px;background:var(--raised);display:flex;align-items:center;justify-content:center;color:var(--copper);flex-shrink:0}
.list-btn .chev{margin-left:auto;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:4px;margin-bottom:12px}
/* ── Player colours grid ── */
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:14px 4px;padding:8px 0 18px;border-bottom:1px solid var(--border)}
.chip-opt{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;cursor:pointer;font-size:11px;line-height:1.2;color:var(--muted);text-align:center}
.chip-opt svg{width:46px;height:46px;border-radius:50%;display:block}
.chip-opt.on{color:var(--text);font-weight:600}
.chip-opt.on svg{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--copper)}
.chip-opt.taken{cursor:default}
.chip-opt.taken svg{opacity:.25}
.chip-opt .owner{position:absolute;top:15px;left:0;right:0;font:600 12px var(--body);color:var(--text)}
/* ── One-time Add to Home Screen hint, floating above the bottom bar ── */
.hint{position:fixed;left:12px;right:12px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 12px);z-index:45;max-width:616px;margin:0 auto;background:var(--raised);border:1px solid var(--copper);border-radius:16px;padding:14px 44px 14px 14px;display:flex;gap:12px;align-items:flex-start}
.hint .icon-btn{position:absolute;top:6px;right:6px}
.hint img{width:40px;height:40px;border-radius:10px;flex-shrink:0}
.share{display:inline-block;color:var(--link);vertical-align:-3px}

/* ── Panels and cards ── */
.pnl{display:none;padding:16px}
.pnl.on{display:block}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);padding:18px;margin-bottom:14px}
.inset{background:var(--raised);border-radius:var(--r-ctl);padding:12px 14px}
.inset+.inset{margin-top:10px}
.two-col .inset{margin-top:0}
.inset .lbl{font-size:12px;color:var(--muted);margin-bottom:4px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.empty{text-align:center;padding:14px 0;margin:0}
.loading{padding:3rem;text-align:center;color:var(--muted)}
.notice{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding:10px 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-ctl);font-size:13px;color:var(--muted)}
.banner{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--gold);border-radius:var(--r-ctl);padding:12px 14px;margin-bottom:14px;color:var(--text)}
.banner svg.i{color:var(--gold)}
.confirm{border:1px solid var(--down);border-radius:var(--r-ctl);padding:14px;margin-top:14px}

/* ── Ranks and avatars ── */
.rank{width:20px;text-align:center;font-family:var(--display);font-weight:800;font-size:15px;color:var(--muted);flex-shrink:0;font-variant-numeric:tabular-nums}
.rank.r1{color:var(--gold)}.rank.r2{color:var(--silver)}.rank.r3{color:var(--copper)}
/* Names by finishing place: gold / silver / bronze, red for last, each with a faint glow.
   The padding + negative margin gives the glow room so overflow:hidden (for long names) doesn't clip it. */
.pl1,.pl2,.pl3,.pl-last{padding:6px 8px;margin:-6px -8px}
.pl1{color:var(--gold);text-shadow:0 0 9px rgba(221,184,114,.45)}
.pl2{color:var(--silver);text-shadow:0 0 9px rgba(197,204,214,.35)}
.pl3{color:var(--copper);text-shadow:0 0 9px rgba(192,138,91,.45)}
.pl-last{color:var(--down);text-shadow:0 0 9px rgba(224,113,95,.45)}
.av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0;letter-spacing:.02em}

/* ── Tables of results (history, edit, scorer) ── */
.grid-res{display:grid;grid-template-columns:1fr 54px 64px 76px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)}
.grid-res:last-child{border-bottom:none}
.grid-res.head{padding:0 0 6px;font-size:11px;color:var(--muted)}
.grid-edit{grid-template-columns:1fr 70px 70px 76px}
.grid-scorer{grid-template-columns:1fr 76px 76px 36px}
.c{text-align:center}.r{text-align:right}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Controls ── */
input{background:var(--raised);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:9px 10px;font:14px var(--body);width:100%}
input:focus{outline:none;border-color:var(--copper)}
input::placeholder{color:#6f675e}
.field-lbl{font-size:12px;color:var(--muted);margin-bottom:5px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--copper);color:var(--base);border:1px solid var(--copper);border-radius:var(--r-ctl);padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--link);border-color:var(--link)}
.btn-ghost{display:inline-flex;align-items:center;gap:6px;background:var(--raised);color:var(--text);border:1px solid var(--border);border-radius:var(--r-ctl);padding:10px 14px;font-size:14px;font-weight:500;cursor:pointer}
.btn-ghost:hover{border-color:var(--muted)}
.btn-danger{display:inline-flex;align-items:center;gap:6px;background:none;color:var(--down);border:1px solid var(--down);border-radius:var(--r-ctl);padding:10px 14px;font-size:14px;font-weight:500;cursor:pointer}
.btn-danger.solid{background:var(--down);color:var(--base);font-weight:600}
.btn-sm{padding:6px 10px;font-size:13px;border-radius:10px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:5px 10px 5px 5px;border-radius:999px;cursor:pointer;border:1px solid var(--border);background:var(--raised)}
.tag:hover{border-color:var(--muted)}
.link{background:none;border:none;color:var(--link);font-size:14px;cursor:pointer;padding:0}
.toast{position:fixed;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px);left:50%;transform:translateX(-50%);background:var(--raised);color:var(--text);border:1px solid var(--copper);padding:9px 20px;border-radius:999px;font-size:14px;font-weight:500;z-index:999;pointer-events:none;opacity:0;transition:opacity .25s}
.toast.on{opacity:1}
.pts{font-family:var(--display);font-weight:700;color:var(--copper)}
.badge{display:inline-block;background:var(--raised);color:var(--copper);border:1px solid var(--border);border-radius:8px;padding:3px 10px;font:700 13px var(--display);min-width:36px;text-align:center}

/* ── Charts and head-to-head ── */

/* ── Table: hero cards ── */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.hero-card{position:relative;overflow:hidden;text-align:left;border-radius:var(--r-card);padding:16px 14px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-width:0}
.hero-card.leader{background:#1B1714;border:1px solid #6E5137}
.hero-card.loser{background:#191313;border:1px solid #5A2C2A}
.hero-card .inlay{position:absolute;top:-12px;right:-30px;width:104px;height:104px;pointer-events:none;opacity:.8;overflow:visible}
.loser .inlay{top:-2px;right:-12px}
/* torn £: crack draws (1.2s in), then the halves drift apart and fade; forwards = stays gone until redrawn */
.tear .crack{stroke-dasharray:100;stroke-dashoffset:100;animation:crack .6s ease-out 1.2s forwards,crack-fade 1.8s ease-in 2.2s forwards}
@keyframes crack{to{stroke-dashoffset:0}}
@keyframes crack-fade{to{opacity:0}}
.tear .half{transform-box:fill-box;transform-origin:50% 100%}
.tear .half.l{animation:tear-l 2.4s cubic-bezier(.4,0,.7,1) 2s forwards}
.tear .half.r{animation:tear-r 2.4s cubic-bezier(.4,0,.7,1) 2s forwards}
@keyframes tear-l{to{transform:translate(-10px,7px) rotate(-11deg);opacity:0}}
@keyframes tear-r{to{transform:translate(10px,9px) rotate(9deg);opacity:0}}
.hero-lbl{font-size:13px;font-weight:500;position:relative}
.leader .hero-lbl{color:var(--link)}
.loser .hero-lbl{color:var(--down)}
.hero-who{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;min-width:0;max-width:100%;position:relative}
.hero-who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero-num{font-size:clamp(22px,6.6vw,34px);line-height:1;position:relative}
.loser .hero-num{color:var(--down)}
.hero-badge{font-size:12px;font-weight:600;line-height:1.3;border-radius:10px;padding:5px 9px;position:relative}
.leader .hero-badge{color:var(--gold);background:rgba(221,184,114,.1)}
.loser .hero-badge{color:var(--down);background:rgba(224,113,95,.1)}
.av.ring{box-shadow:0 0 0 2px #1B1714,0 0 0 3.5px var(--gold)}
/* the gold glint: a short gold dash that runs round the inlay's diamond about every 6s */
.glint{stroke-dasharray:9 91;animation:glint 6s linear infinite;filter:drop-shadow(0 0 3px var(--gold))}
@keyframes glint{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}

/* ── Table: standings and recent sessions ── */
.sec-head{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 10px}
.sec-head .h2{margin:0}
.standings{padding:6px 14px}
/* The card is one grid shared by every row (subgrid), so the name column is exactly as wide as the
   longest name, the score column fits the widest score, and the bar takes all the space left over. */
.standings{display:grid;grid-template-columns:20px 32px minmax(0,max-content) minmax(56px,1fr) max-content;column-gap:10px}
.st-row{grid-column:1/-1;display:grid;grid-template-columns:subgrid;align-items:center;width:100%;background:none;border:none;border-bottom:1px solid var(--border);padding:11px 0;text-align:left;cursor:pointer}
.st-row:last-child{border-bottom:none}
.st-name{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-bar{position:relative;height:10px}
.st-bar.centred::before{content:"";position:absolute;left:var(--z,50%);top:-6px;bottom:-6px;width:1px;background:var(--border)}
.st-bar span{position:absolute;top:0;bottom:0;border-radius:5px;min-width:3px}
.st-bar .up{background:var(--up)}.st-bar .down{background:var(--down)}.st-bar .flat{background:var(--muted)}.st-bar .pts{background:var(--copper)}
.st-num{text-align:right;font-size:15px}
.st-num.pts{color:var(--copper)}
.sess-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;padding:14px}
.date-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;width:52px;height:52px;border-radius:12px;background:var(--raised);flex-shrink:0;line-height:1.1}
.date-tile span{font-size:11px;color:var(--muted);text-transform:uppercase}
.date-tile svg.i{width:22px;height:22px}
.date-tile b{font:800 19px var(--display);font-variant-numeric:tabular-nums}
.sess-mid{display:flex;flex-direction:column;min-width:0;flex:1}
.sess-name{font-size:16px;font-weight:600}
.sess-mid .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess-pot{font-size:17px}

/* ── Stats: headline tiles, running-total chart, players list ── */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);padding:14px 16px;min-width:0}
.tile .lbl{font-size:13px;color:var(--muted);margin-bottom:4px}
.tile .big{font-size:clamp(22px,6.6vw,30px);line-height:1.1}
.tile .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}
.tile.wide{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.chart-card{padding:14px 14px 16px;margin-bottom:22px}
.chart-card svg{width:100%;display:block}
/* one chip per player under the chart; --c is that player's line colour */
.pchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pchip{display:inline-flex;align-items:center;gap:8px;background:none;border:1px solid var(--border);border-radius:999px;padding:7px 14px;font-size:14px;color:var(--muted);cursor:pointer}
.pchip .dot{width:8px;height:8px;border-radius:50%;background:#4A4540}
.pchip.on{border-color:var(--c);color:var(--text);background:color-mix(in srgb,var(--c) 10%,transparent)}
.pchip.on .dot{background:var(--c)}
.plist{padding:2px 16px}
.prow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;border-bottom:1px solid var(--border);padding:12px 0;text-align:left;cursor:pointer;transition:background .4s}
.prow:last-child{border-bottom:none}
.prow .mid{flex:1;min-width:0}
.prow .nm{display:block;font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .money{font-size:17px}
.prow .chev{color:var(--muted)}
.prow .mid .sub{display:block}
.fit-btn{display:inline-flex;align-items:center;gap:5px;background:none;border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted);cursor:pointer}
.fit-btn.on{border-color:var(--copper);color:var(--text);background:rgba(192,138,91,.12)}
.fit-btn.on svg.i{width:14px;height:14px;color:var(--copper)}
.fit-btn:disabled{opacity:.4;cursor:default}
.prow.flash{background:var(--raised)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.glint,.tear .crack{display:none}}
</style>
</head>
<body>

<div class="hdr" id="hdr">
  <h1 class="title">Family poker night</h1>
</div>

<div class="season-bar" id="season-bar"></div>
<div class="dd-dim" id="dd-dim" hidden onclick="closePicker()"></div>

<div class="pnl on" id="pnl-lb"><div class="loading">Loading…</div></div>
<div class="pnl" id="pnl-scorer"></div>
<div class="pnl" id="pnl-hist"></div>
<div class="pnl" id="pnl-stats"></div>
<div class="pnl" id="pnl-more"></div>
<div class="pnl" id="pnl-rules"></div>
<div class="pnl" id="pnl-colours"></div>
<div class="toast" id="toast"></div>
<div class="hint" id="a2hs-hint" hidden></div>

<!-- Bottom bar. data-tab says which panel each button opens; Rules lives under More. -->
<nav class="nav" aria-label="Main">
  <div class="nav-in">
    <button class="nav-btn on" data-tab="lb" onclick="goTab('lb')"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="9.5" ry="6.5"/><ellipse cx="12" cy="12" rx="5.5" ry="3.2"/></svg>Table</button>
    <button class="nav-btn" data-tab="stats" onclick="goTab('stats')"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</button>
    <button class="nav-add" data-tab="scorer" onclick="goTab('scorer')" aria-label="New session"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="nav-btn" data-tab="hist" onclick="goTab('hist')"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Sessions</button>
    <button class="nav-btn" data-tab="more" data-also="rules colours" onclick="goTab('more')"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>More</button>
  </div>
</nav>

<script type="module" src="db.js"></script>
<script src="stats.js"></script>
<script>
// ══════════════ PLAYER COLOURS ══════════════
// Each player has one poker-chip colour; no two share. To add a colour, add a line here
// AND add its id to the list in firestore.rules (config/colours), or saving it will be rejected.
// dark:true = light chip, so it gets dark text. lift = how much white to mix into its chart line,
// because the darkest chips vanish against the black chart; line = a hand-picked line colour instead
// (navy and slate both turn grey-blue with white mixed in, so they get distinct ones).
const PALETTE=[
  {id:'ivory',  name:'Ivory',        hex:'#ECE6DA', dark:true},
  {id:'red',    name:'Chip red',     hex:'#B23B37'},
  {id:'blue',   name:'Chip blue',    hex:'#2E59B5'},
  {id:'gold',   name:'Chip gold',    hex:'#DDB872', dark:true},
  {id:'copper', name:'Copper',       hex:'#C08A5B', dark:true},
  {id:'oxblood',name:'Oxblood',      hex:'#7E2A2E', lift:.4},
  {id:'navy',   name:'Navy',         hex:'#1F3A73', line:'#7894D6'},
  {id:'jade',   name:'Jade',         hex:'#2F7A5C'},
  {id:'teal',   name:'Teal',         hex:'#2A7A85'},
  {id:'plum',   name:'Plum',         hex:'#6B3A7A', lift:.4},
  {id:'violet', name:'Violet',       hex:'#5B4BA8'},
  {id:'orange', name:'Burnt orange', hex:'#A9542A'},
  {id:'rose',   name:'Rose',         hex:'#B85A72'},
  {id:'olive',  name:'Olive',        hex:'#7F7A3A'},
  {id:'slate',  name:'Slate',        hex:'#5E6B7A', line:'#AAB2BC'},
];
const PAL=Object.fromEntries(PALETTE.map(c=>[c.id,c]));
const DEFAULT_COLOURS={Ami:'red',Kathiir:'jade',Sanj:'orange',Aaron:'violet',Varunn:'blue',Vittu:'navy',Ari:'oxblood'};
let COLOURS={};   // resolved player name → colour id (see resolveColours)

// Everyone who has ever played (players list + every session in both chapters), plus `extra` names
function allPlayerNames(extra=[]){
  const set=new Set([...DATA.players,...extra]);
  Object.values(DATA.eras).forEach(e=>e.seasons.forEach(se=>se.sessions.forEach(s=>s.results.forEach(r=>set.add(r.player)))));
  return [...set].sort((a,b)=>a.localeCompare(b));
}
// Work out everyone's colour: saved choices first, then DEFAULT_COLOURS, then the first unused
// palette colour (players in name order). A colour is only ever given to one player.
function resolveColours(extra=[]){
  const out={},used=new Set();
  const take=(n,id)=>{if(PAL[id]&&!used.has(id)&&!(n in out)){out[n]=id;used.add(id);}};
  const names=allPlayerNames(extra);
  names.forEach(n=>take(n,DATA.colours[n]));
  names.forEach(n=>take(n,DEFAULT_COLOURS[n]));
  names.forEach(n=>{if(!(n in out)){const free=PALETTE.find(c=>!used.has(c.id));if(free)take(n,free.id);}});
  return out;   // if the palette ever runs out, extra players have no entry and show as slate
}
function chipOf(n){return PAL[COLOURS[n]]||PAL.slate;}
// A player's chart-line colour: their chip colour, lightened for the dark chips
function lineCol(n){const c=chipOf(n);return c.line||(c.lift?mix(c.hex,'#ffffff',c.lift):c.hex);}
// Blend two #rrggbb colours: t=0 gives a, t=1 gives b
function mix(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));const A=p(a),B=p(b);
  return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');}
// True if `map` differs from what's saved, i.e. it should be written to Firestore
function coloursChanged(map){return Object.keys(map).some(n=>DATA.colours[n]!==map[n]);}

// ══════════════ ICONS ══════════════
// Simple line icons (24×24, drawn with the current text colour). icon('pencil') → <svg>.
const ICON_PATHS={
  pencil:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  lock:'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  trophy:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0Z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
  up:'<path d="m3 17 6-6 4 4 8-8"/><path d="M14 7h7v7"/>',
  down:'<path d="m3 7 6 6 4-4 8 8"/><path d="M14 17h7v-7"/>',
  award:'<circle cx="12" cy="9" r="6"/><path d="M8.5 14 7 22l5-3 5 3-1.5-8"/>',
  stack:'<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>',
  coins:'<circle cx="9" cy="9" r="6"/><path d="M15.5 9.2A6 6 0 1 1 9.2 15.5"/>',
  right:'<path d="m9 6 6 6-6 6"/>',
  left:'<path d="m15 6-6 6 6 6"/>',
  open:'<path d="m6 9 6 6 6-6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  chip:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>',
  book:'<path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H20v15H5.5A1.5 1.5 0 0 0 4 19.5z"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H20v-3"/>',
  phone:'<rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/>',
  calendar:'<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/>',
};
function icon(n){return `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICON_PATHS[n]}</svg>`;}

// ══════════════ SCORING ══════════════
const BKT=[[0,0],[0.5,5],[0.8,8],[1.0,10],[1.2,13],[1.5,16],[2.0,19],[2.5,22],[3.0,25],[4.0,30],[5.0,35]];
function interpPts(m){if(m<=0)return 0;if(m>=5)return 35+(m-5)*5;
  for(let i=1;i<BKT.length;i++){const[lm,lp]=BKT[i-1],[hm,hp]=BKT[i];if(m<=hm)return lp+((m-lm)/(hm-lm))*(hp-lp);}return 35;}
function rebuyMult(b){if(b<=40)return 1;if(b<=60)return .9;if(b<=80)return .5;if(b<=100)return .25;return .25*Math.pow(.5,Math.floor((b-100)/20)+1);}
function oldPts(b,f){return Math.round(interpPts(b>0?f/b:0)*rebuyMult(b));}
// pnl(r) and K live in stats.js

// ══════════════ STATE ══════════════
// All database access goes through window.DB (db.js); nothing here talks to Firebase.
let DATA=null;        // from DB.loadAll(): {activeSeasonNumber, eras:{'era-1':{...}, 'era-2':{...}}, players:[names]}
let VIEW='era-2';     // 'era-2' (Chapter 2) | 'era-1' (Chapter 1, read-only) | 'all' (both pooled, read-only)
let seasons=[];       // seasons shown in the current VIEW: [{id, name, number, system, sessions:[{id, seq, name, date, results}]}]
let curSeason=0;      // index into seasons, or -1 for "All time"
let SYS='pnl';        // display system for the old-points season (Chapter 1 Season 1)
let TAB='lb';
let scorerPlayers=[], scorerRows={}, scorerName="", scorerResult=null;
let editIdx=null, editData=null;
let busy=false;       // true while a save is in flight, to stop double-clicks saving twice

// ══════════════ INIT ══════════════
function showLoadError(m){document.getElementById('pnl-lb').innerHTML=`<div class="loading">${m}</div>`;}
async function init(){
  try{DATA=await DB.loadAll();}
  catch(e){console.error(e);showLoadError("Couldn't load data. Check your connection and refresh.");return;}
  COLOURS=resolveColours();
  setView('era-2');
  showA2hsHint();
}
// db.js is a module and loads after this script, so wait for its "db-ready" event.
function startWhenDbReady(){
  if(window.DB){init();return;}
  window.addEventListener('db-ready',init,{once:true});
  setTimeout(()=>{if(!window.DB)showLoadError("Couldn't reach the database. Check your connection and refresh.");},15000);
}
function era2(){return DATA.eras['era-2'];}
function saveFailed(e){
  console.error(e);
  toast(e&&e.code==='permission-denied'?'Rejected. Refresh and check the details':'Save failed. Check your connection');
}
const DATE_RE=/^[0-3][0-9]\/[01][0-9]\/20[0-9][0-9]$/;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200);}

// ══════════════ SEASON BAR ══════════════
// Switch between Chapter 2 (era-2), Chapter 1 (era-1) and All time (both pooled).
function setView(v){
  VIEW=v;
  if(v==='all'){
    // pooled read-only view; Chapter 1 season names are prefixed so History can tell them apart
    seasons=[...DATA.eras['era-1'].seasons.map(s=>({...s,name:'Chapter 1 '+s.name})),...era2().seasons];
    curSeason=-1;
  }else{
    seasons=DATA.eras[v].seasons;
    curSeason=v==='era-2'?seasons.findIndex(s=>s.number===DATA.activeSeasonNumber):seasons.length-1;
  }
  SYS='pnl';
  scorerResult=null; editIdx=null;
  renderSeasonBar(); render();
}

// ── Chapter / Season pickers ──
// Each picker is a button; tapping it drops a themed list down beneath it.
// openPicker says which list is open ('chapter' | 'season' | null).
const CHAPTERS=[['all','All time'],['era-1','Chapter 1'],['era-2','Chapter 2']];
let openPicker=null;
// items: [{value, label, on, current}] or {sep:true} or {value, label, action:true}
function picker(id,label,value,items,alignRight){
  const open=openPicker===id;
  const list=open?`<div class="dropdown${alignRight?' right':''}" role="listbox" aria-label="${label}">
    ${items.map(it=>it.sep?`<div class="dd-sep" role="separator"></div>`
      :`<button class="dd-item${it.on?' on':''}${it.action?' action':''}" role="option" aria-selected="${!!it.on}" onclick="choosePicker('${id}','${it.value}')">
        ${it.action?icon('plus'):''}${it.label}${it.current?'<span class="tag-cur">current</span>':''}${it.on?`<span class="tick">${icon('check')}</span>`:''}</button>`).join('')}
  </div>`:'';
  return `<div class="picker-wrap"><button class="picker" id="picker-${id}" ${items?`aria-haspopup="listbox" aria-expanded="${open}" onclick="togglePicker('${id}')"`:'disabled'}>
    <div class="lbl">${label}</div><div class="val">${value}</div>${items?`<span class="chev">${icon('open')}</span>`:''}</button>${list}</div>`;
}
function togglePicker(id){
  openPicker=openPicker===id?null:id;renderSeasonBar();
  if(openPicker)(document.querySelector('.dropdown .dd-item.on')||document.querySelector('.dropdown .dd-item'))?.focus();
}
function closePicker(){if(!openPicker)return;const id=openPicker;openPicker=null;renderSeasonBar();document.getElementById('picker-'+id)?.focus();}
function choosePicker(id,v){
  openPicker=null;
  if(id==='chapter'){setView(v);return;}
  if(v==='new'){renderSeasonBar();newSeason();return;}
  switchSeason(v);
}
// While a list is open: Esc closes it, arrow keys move between its options
document.addEventListener('keydown',e=>{
  if(!openPicker)return;
  if(e.key==='Escape'){e.preventDefault();closePicker();return;}
  if(e.key!=='ArrowDown'&&e.key!=='ArrowUp')return;
  e.preventDefault();
  const items=[...document.querySelectorAll('.dropdown .dd-item')];
  const i=items.indexOf(document.activeElement);
  const next=e.key==='ArrowDown'?(i+1)%items.length:(i<=0?items.length-1:i-1);
  items[next]?.focus();
});
function renderSeasonBar(){
  const allTime=isAllTime();
  const s=allTime?null:seasons[curSeason];
  const isArchived = s && s.system==="old";
  const live=VIEW==='era-2';
  const chapterItems=CHAPTERS.map(([v,l])=>({value:v,label:l,on:VIEW===v,current:v==='era-2'}));
  // In the pooled All time view there's only one choice, so the Season picker is disabled
  const seasonItems=VIEW==='all'?null:[
    {value:-1,label:'All seasons',on:allTime},
    ...seasons.map((se,i)=>({value:i,label:se.name,on:i===curSeason,current:live&&se.number===DATA.activeSeasonNumber})),
    ...(live?[{sep:true},{value:'new',label:'New season',action:true}]:[])];
  const chapterName=CHAPTERS.find(([v])=>v===VIEW)[1];
  let html=`<div class="pickers">${picker('chapter','Chapter',chapterName,chapterItems)}${picker('season','Season',allTime?'All seasons':s.name,seasonItems,true)}</div>`;
  // Dim the page behind an open list; tapping the dim closes it
  document.getElementById('dd-dim').hidden=!openPicker;
  // Only the old-points season (Chapter 1 Season 1) gets the comparison toggle
  if(isArchived&&TAB!=='stats'){
    html+=`<div class="seg">
      <button class="${SYS==='pnl'?'on':''}" onclick="setSys('pnl')">Shrunk PnL</button>
      <button class="${SYS==='old'?'on':''}" onclick="setSys('old')">Old points</button>
    </div>`;
  }
  document.getElementById('season-bar').innerHTML=html;
}

function switchSeason(i){
  curSeason=+i;
  SYS = (isAllTime()||seasons[curSeason].system!=="old") ? "pnl" : SYS;
  scorerResult=null; editIdx=null;
  renderSeasonBar(); render();
}
function setSys(s){SYS=s;renderSeasonBar();render();}

// In-app confirmation dialog. Resolves true if the user presses the confirm button.
//   await confirmSheet({title:'Start Season 3?', body:'…', ok:'Start Season 3'})
function confirmSheet({title,body,ok,cancel='Cancel'}){
  return new Promise(resolve=>{
    const bg=document.createElement('div');bg.className='sheet-bg';
    bg.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <h2 id="sheet-title">${title}</h2><p>${body}</p>
      <div class="actions"><button class="btn-ghost" data-r="0">${cancel}</button><button class="btn" data-r="1">${ok}</button></div></div>`;
    const done=r=>{bg.remove();document.removeEventListener('keydown',esc);resolve(r);};
    const esc=e=>{if(e.key==='Escape')done(false);};
    bg.addEventListener('click',e=>{if(e.target===bg)done(false);else if(e.target.dataset.r)done(e.target.dataset.r==='1');});
    document.addEventListener('keydown',esc);
    document.body.appendChild(bg);
    bg.querySelector('[data-r="0"]').focus();
  });
}

async function newSeason(){
  if(busy||!DATA)return;
  const n=DATA.activeSeasonNumber+1;
  const ok=await confirmSheet({title:`Start Season ${n}?`,
    body:`Season ${n} becomes the current season of Chapter 2, and new sessions go into it. Season ${n-1} keeps its results. This can't be undone.`,
    ok:`Start Season ${n}`});
  if(!ok)return;
  busy=true;
  try{
    const se=await DB.startNewSeason(DATA.activeSeasonNumber);
    era2().seasons.push(se); DATA.activeSeasonNumber=se.number;
  }catch(e){saveFailed(e);return;}
  finally{busy=false;}
  setView('era-2');
  toast(`Season ${n} created`);
}

// Show one panel and light up its bottom-bar button (More stays lit while Rules is open).
// The title and Chapter / Season pickers only appear on the tabs that depend on them.
const HEADER_TABS=['lb','stats','hist'];
function goTab(id){
  TAB=id;
  const hdr=HEADER_TABS.includes(id);
  document.getElementById('hdr').hidden=!hdr;
  document.getElementById('season-bar').hidden=!hdr;
  if(!hdr)openPicker=null;
  if(DATA)renderSeasonBar();   // the old-points toggle shows on Table and Sessions, not Stats
  document.querySelectorAll('.pnl').forEach(p=>p.classList.toggle('on',p.id==='pnl-'+id));
  document.querySelectorAll('.nav [data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===id||(b.dataset.also||'').split(' ').includes(id)));
  window.scrollTo(0,0);
  render();
}

// ══════════════ ADD TO HOME SCREEN ══════════════
// Running as an installed home-screen app? (iOS uses navigator.standalone)
function isInstalled(){return window.navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;}
const SHARE_ICON=`<svg class="i share" viewBox="0 0 24 24" aria-label="Share"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>`;
const A2HS_STEPS=`In Safari, tap ${SHARE_ICON} <strong>Share</strong>, then <strong>Add to Home Screen</strong>. It opens full screen, like an app.`;
// One-time hint on phones that haven't installed it; dismissing is remembered on this device.
function showA2hsHint(){
  let seen=false;try{seen=localStorage.getItem('a2hsHintDismissed')==='1';}catch(e){}
  if(seen||isInstalled()||!matchMedia('(pointer: coarse)').matches)return;
  const el=document.getElementById('a2hs-hint');
  el.innerHTML=`<img src="icons/icon-180.png" alt="">
    <div><div style="font-weight:600;margin-bottom:2px">Put Poker Night on your home screen</div><div class="sub" style="font-size:13px;line-height:1.5">${A2HS_STEPS}</div></div>
    <button class="icon-btn" onclick="dismissA2hsHint()" aria-label="Dismiss">${icon('x')}</button>`;
  el.hidden=false;
}
function dismissA2hsHint(){
  document.getElementById('a2hs-hint').hidden=true;
  try{localStorage.setItem('a2hsHintDismissed','1');}catch(e){}
}

// ══════════════ HELPERS ══════════════
function isAllTime(){return curSeason===-1;}
function curSessions(){
  if(isAllTime()){
    // pool every session from every season, tagged with season name
    return seasons.flatMap(se=>se.sessions.map(s=>({...s,_season:se.name})));
  }
  return seasons[curSeason].sessions;
}
// Sessions can be edited/deleted in any Chapter 2 season (Chapter 1 and pooled views are read-only)...
function canEdit(){return VIEW==='era-2' && !isAllTime();}
// ...but new sessions are only added to the current Chapter 2 season.
function isActiveSeason(){return canEdit() && seasons[curSeason].number===DATA.activeSeasonNumber;}
function readOnlyMsg(){
  if(VIEW==='all')return 'All time shows every session ever (read-only).';
  if(isAllTime())return `All seasons of ${VIEW==='era-1'?'Chapter 1':'Chapter 2'} is a read-only view.`;
  if(VIEW==='era-1')return `Chapter 1 ${seasons[curSeason].name} is archived (read-only).`;
  return `${seasons[curSeason].name} isn't the current season.`;
}
// Full label for a session, e.g. "Chapter 2 · Season 1 · Session 3", in any view.
// In pooled views the session carries _season; in the All time view Chapter 1 season names start with "Chapter 1 ".
function sessionLabel(s){
  let season=s._season||seasons[curSeason].name, era=VIEW==='era-1'?'Chapter 1':'Chapter 2';
  if(season.startsWith('Chapter 1 ')){era='Chapter 1';season=season.slice(10);}
  return `${era} · ${season} · ${s.name}`;
}
function av(n,s=28,ring){const c=chipOf(n);return `<div class="av${ring?' ring':''}" style="width:${s}px;height:${s}px;font-size:${Math.round(s*.38)}px;background:${c.hex};color:${c.dark?'#1A1612':'#F4EFE6'}">${n.slice(0,2).toUpperCase()}</div>`;}
function rank(i){return `<span class="rank${i<3?' r'+(i+1):''}">${i+1}</span>`;}
// Name colour class for finishing place i of n: pl1/pl2/pl3 for the podium, pl-last for last place
// (last wins over the podium, so with 2 or 3 players the bottom one is red, not silver/bronze)
function place(i,n){return n>1&&i===n-1?'pl-last':i<3?'pl'+(i+1):'';}

// Money. Every format drops ".00" on whole pounds.
//   money(v)   exact, signed       (+£12.35)  for amounts people entered: a session's in/out and PnL
//   money25(v) nearest 25p, signed (+£12.25)  for summaries: standings, totals, averages
//   gbp(v)     exact, no sign      (£12.35)
// Ranking always uses exact values; rounding is display only.
function amt(a){a=Math.round(Math.abs(a)*100)/100;return a.toLocaleString('en-GB',{minimumFractionDigits:a%1?2:0,maximumFractionDigits:2});}   // 1965 → 1,965
function gbp(v){return '£'+amt(v);}
function money(v){return `${Math.round(v*100)/100>=0?'+':'−'}£${amt(v)}`;}
function round25(v){return Math.round(v*4)/4||0;}
function money25(v){return money(round25(v));}
function gbp25(v){return gbp(round25(v));}
// Colour class for a value: up / down / flat
function cls(v){return v>0.004?'up':v<-0.004?'down':'flat';}

function buildStats(){
  const m={};
  curSessions().forEach(s=>{
    const ranked=s.results.map(r=>({...r,_p:pnl(r),_o:oldPts(r.buyin,r.final)}));
    const sortP=[...ranked].sort((a,b)=>b._p-a._p);
    const sortO=[...ranked].sort((a,b)=>b._o-a._o);
    ranked.forEach(r=>{
      if(!m[r.player])m[r.player]={name:r.player,n:0,pnlTot:0,oldTot:0,winsP:0,winsO:0,rows:[],in:0,out:0};
      const e=m[r.player];e.n++;e.pnlTot+=r._p;e.oldTot+=r._o;e.in+=r.buyin;e.out+=r.final;
      e.rows.push({sname:sessionLabel(s),buyin:r.buyin,final:r.final,p:r._p,o:r._o});
    });
    if(sortP[0])m[sortP[0].player].winsP++;
    if(sortO[0])m[sortO[0].player].winsO++;
  });
  return Object.values(m);
}
function ranked(){
  const all=buildStats();const total=curSessions().length;
  all.forEach(p=>{p.shrunk=p.pnlTot/(p.n+K);p.rawAvg=p.pnlTot/p.n;p.oldAvg=p.oldTot/p.n;
    p.metric=SYS==='pnl'?p.shrunk:p.oldAvg;p.seasonTotal=total;});
  return all.sort((a,b)=>b.metric-a.metric);
}
function emptyCard(msg){return `<div class="card"><p class="note empty">${msg}</p></div>`;}

async function pickColour(name,id){
  if(busy||COLOURS[name]===id)return;

const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
// Score as shown on the Table: 25p-rounded money, or points for the old system
function score(v){return SYS==='pnl'?money25(v):v.toFixed(1)+' pts';}
function gap(v){return SYS==='pnl'?gbp25(v):v.toFixed(1)+' pts';}
function leaderLabel(){

// Decorative Art Deco inlay for the leader card, with a gold glint travelling round the diamond
const INLAY=`<svg class="inlay" viewBox="0 0 120 120" aria-hidden="true">
  <rect x="30" y="18" width="84" height="84" fill="none" stroke="var(--copper)" stroke-width="1" opacity=".55"/>
  <rect x="40" y="28" width="64" height="64" fill="none" stroke="var(--copper)" stroke-width="1" opacity=".35"/>
  <path d="M72 0 132 60 72 120 12 60Z" fill="none" stroke="var(--copper)" stroke-width="1" opacity=".55"/>
  <path class="glint" d="M72 0 132 60 72 120 12 60Z" pathLength="100" fill="none" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/>
</svg>`;
// A torn £ for the season loser. Each time the Table is drawn it plays once: a zigzag crack
// runs down the middle, then the two halves drift apart and fade. Each half is the same £
// clipped to one side of the zigzag, so they fit together exactly until they separate.
const ZIG='66,2 58,15 68,28 56,41 68,54 57,67 67,80 60,94';
const TORN=`<svg class="inlay tear" viewBox="0 0 120 120" aria-hidden="true">
  <defs>
    <clipPath id="tear-l"><polygon points="0,0 ${ZIG} 0,120"/></clipPath>
    <clipPath id="tear-r"><polygon points="120,0 ${ZIG} 120,120"/></clipPath>
  </defs>
  <g class="half l"><text clip-path="url(#tear-l)" x="64" y="84" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="800" font-size="92" fill="none" stroke="var(--down)" stroke-width="1.2" opacity=".6">£</text></g>
  <g class="half r"><text clip-path="url(#tear-r)" x="64" y="84" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="800" font-size="92" fill="none" stroke="var(--down)" stroke-width="1.2" opacity=".6">£</text></g>
  <polyline class="crack" points="${ZIG}" pathLength="100" fill="none" stroke="var(--down)" stroke-width="1.4" stroke-linejoin="round"/>
</svg>`;

function renderLB(){
  const el=document.getElementById('pnl-lb');
  const SS=curSessions();
  if(SS.length===0){
    el.innerHTML=emptyCard(`No sessions yet${isAllTime()?'':' in '+seasons[curSeason].name}. Tap <strong>+</strong> to add the first one.`);
    return;
  }
  const all=ranked();const n=all.length;
  const first=all[0],second=all[1],last=all[n-1],aboveLast=all[n-2];
  let html=`<div class="hero">
    <button class="hero-card leader" onclick="showPlayer('${q(first.name)}')">
      ${INLAY}
      <div class="hero-lbl">${leaderLabel()}</div>
      <div class="hero-who">${av(first.name,38,'ring')}<span class="pl1">${first.name}</span></div>
      <div class="hero-num money">${score(first.metric)}</div>
      ${second?`<span class="hero-badge">${first.metric-second.metric<0.125?'Level with 2nd':`+${gap(first.metric-second.metric)} clear of&nbsp;2nd`}</span>`:''}
    </button>
    ${n>1?`<button class="hero-card loser" onclick="showPlayer('${q(last.name)}')">
      ${TORN}
      <div class="hero-lbl">${loserLabel()}</div>
      <div class="hero-who">${av(last.name,38)}<span class="pl-last">${last.name}</span></div>
      <div class="hero-num money">${score(last.metric)}</div>
      <span class="hero-badge">${aboveLast.metric-last.metric<0.125?`Level with&nbsp;${n>2?'2nd‑last':'the&nbsp;leader'}`:`${gap(aboveLast.metric-last.metric)} adrift of&nbsp;${n>2?'2nd‑last':'the&nbsp;leader'}`}</span>
    </button>`:''}
  </div>`;

  // Standings: bars grow right (green) or left (red) from a zero line. The zero line sits where the
  // biggest win just reaches the right edge and the biggest loss just reaches the left edge, so the
  // bars always use the full width (all positive → zero line at the left edge).
  // The old points system has no negatives, so its bars all grow right from the left edge.
  const isPnl=SYS==='pnl';
  const maxUp=Math.max(...all.map(p=>p.metric),0), maxDown=Math.max(...all.map(p=>-p.metric),0);
  const span=Math.max(maxUp+maxDown,0.01);
  const zero=maxDown/span*100;   // zero line, as % from the left of the bar
  html+=`<div class="sec-head"><h2 class="h2">${VIEW==='all'?'All-time standings':'Standings'}</h2><button class="link" onclick="openRules()">How it's scored</button></div>
  <div class="card standings">
    ${all.map((p,i)=>{
      const w=Math.abs(p.metric)/span*100;
      const bar=isPnl?(p.metric>=0?`left:${zero}%;width:${w}%`:`right:${100-zero}%;width:${w}%`):`left:0;width:${w}%`;
      const c=isPnl?cls(round25(p.metric)):'pts';
      return `<button class="st-row" onclick="showPlayer('${q(p.name)}')">
        ${rank(i)}${av(p.name,32)}<span class="st-name ${place(i,n)}">${p.name}</span>
        <span class="st-bar${isPnl?' centred':''}" style="--z:${zero}%"><span class="${c}" style="${bar}"></span></span>
        <span class="money st-num ${c}">${score(p.metric)}</span></button>`;}).join('')}
  </div>`;

  // Past seasons and pooled views just get a link to Sessions; the current season shows its latest two
  if(!isActiveSeason()){
    html+=`<button class="card sess-card" onclick="goTab('hist')">
      <span class="date-tile accent">${icon('calendar')}</span>
      <span class="sess-mid"><span class="sess-name">See all sessions</span>
        <span class="sub">${SS.length} session${SS.length!==1?'s':''} played</span></span>
      <span class="sub">${icon('right')}</span></button>`;
    el.innerHTML=html;
    return;
  }
  const recent=SS.slice(-2).reverse();
  html+=`<div class="sec-head"><h2 class="h2">Recent sessions</h2><button class="link" onclick="goTab('hist')">See all</button></div>
  ${recent.map(s=>{
    const [dd,mm]=s.date.split('/');
    const winner=[...s.results].sort((a,b)=>pnl(b)-pnl(a))[0];
    const pot=s.results.reduce((a,r)=>a+r.buyin,0);
    return `<button class="card sess-card" onclick="goTab('hist')">
      <span class="date-tile"><span>${MONTHS[+mm-1]||''}</span><b>${dd}</b></span>
      <span class="sess-mid"><span class="sess-name">${s.name}</span>
        <span class="sub">${s.results.length} players · ${winner.player} took it</span></span>
      <span class="money sess-pot">${gbp(pot)}</span></button>`;}).join('')}`;
  el.innerHTML=html;
}

      <div class="grid-res grid-scorer head"><span>Player</span><span class="c">Buy-in £</span><span class="c">Final £</span><span></span></div>
      ${scorerPlayers.map(p=>`<div class="grid-res grid-scorer">

    <div id="scorer-res">${scorerResult||''}</div>`;

function addPN(name){if(scorerPlayers.includes(name)){toast('Already added');return;}scorerPlayers.push(name);scorerRows[name]={buyin:20,final:''};renderScorer();}
function addP(){const v=document.getElementById('np').value.trim();if(!v)return;
  if(v.length>30||v.includes('/')){toast('Names: up to 30 characters, no "/"');return;}addPN(v);}
function rmP(name){scorerPlayers=scorerPlayers.filter(p=>p!==name);delete scorerRows[name];renderScorer();}
function readScorer(){return scorerPlayers.map(p=>{const b=parseFloat(scorerRows[p]?.buyin)||0;const f=parseFloat(scorerRows[p]?.final)||0;return{player:p,buyin:b,final:f};});}
function calcScores(){
  if(!scorerPlayers.length){toast('Add players first');return;}
  const rows=readScorer().map(r=>({...r,p:pnl(r)})).sort((a,b)=>b.p-a.p);
  scorerResult=`<div class="banner">${icon('trophy')}<span>Biggest winner: <strong>${rows[0].player}</strong>, <span class="money">${money(rows[0].p)}</span></span></div>
    <div class="card"><h2 class="h2" style="margin-bottom:6px">Results</h2>
    ${rows.map((r,i)=>`<div class="row">${rank(i)}${av(r.player,26)}
      <span style="flex:1;min-width:0">${r.player}</span>
      <span class="sub">${gbp(r.buyin)} → ${gbp(r.final)}</span>
      <span class="money ${cls(r.p)}">${money(r.p)}</span></div>`).join('')}</div>`;
  renderScorer();
}
async function saveSession(){
  if(busy)return;
  if(scorerPlayers.length<2){toast('Add at least 2 players');return;}
  const se=seasons[curSeason];
  const rows=readScorer();const d=new Date();
  const date=`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
  const name=(document.getElementById('sname').value.trim())||`Session ${se.sessions.length+1}`;
  const seq=se.sessions.reduce((m,s)=>Math.max(m,s.seq||0),0)+1;
  const s={seq,name,date,results:rows};
  const cols=resolveColours(rows.map(r=>r.player));
  const sendCols=coloursChanged(cols)?cols:undefined;
  busy=true;
  try{s.id=await DB.saveSession(se.id,s,sendCols);}catch(e){saveFailed(e);return;}finally{busy=false;}
  if(sendCols)DATA.colours=sendCols;
  COLOURS=cols;
  se.sessions.push(s);
  rows.forEach(r=>{if(!DATA.players.includes(r.player))DATA.players.push(r.player);});
  scorerPlayers=[];scorerRows={};scorerName="";scorerResult=null;
  renderScorer();toast('Session saved');
}

      <input type="number" id="eb${i}" value="${r.buyin}" min="0" step="5" class="c" oninput="liveEdit(${i})">
      <input type="number" id="ef${i}" value="${r.final}" min="0" step="0.25" class="c" oninput="liveEdit(${i})">
      <span id="ep${i}" class="money r ${cls(pnl(r))}">${money(pnl(r))}</span></div>`).join('')}
    <div id="edit-actions" style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
      <button class="btn-danger" onclick="askDelete(true)">Delete</button>
      <span style="flex:1"></span>
      <button class="btn-ghost" onclick="editIdx=null;editData=null;renderHist()">Cancel</button>
      <button class="btn" onclick="saveEdit()">Save changes</button></div>
    <div id="delete-confirm" class="confirm" hidden>
      <p style="margin-bottom:12px">Delete <strong>${s.name}</strong>? It disappears from the app for everyone, but is kept in the database so it can be restored.</p>
      <div style="display:flex;gap:8px"><button class="btn-ghost" onclick="askDelete(false)">Keep it</button>
      <button class="btn-danger solid" onclick="confirmDelete()">Yes, delete</button></div></div></div>`;
}
// Show or hide the delete confirmation without re-rendering, so typed edits aren't lost
function askDelete(on){
  document.getElementById('delete-confirm').hidden=!on;
  document.getElementById('edit-actions').hidden=on;
}
function liveEdit(i){const b=parseFloat(document.getElementById('eb'+i).value)||0;const f=parseFloat(document.getElementById('ef'+i).value)||0;
  const v=f-b;const el=document.getElementById('ep'+i);el.textContent=money(v);el.className='money r '+cls(v);}
async function saveEdit(){
  const s=editData;const n=document.getElementById('e-name').value.trim();const d=document.getElementById('e-date').value.trim();
  if(n)s.name=n;if(d)s.date=d;
  if(!DATE_RE.test(s.date)){toast('Date must be DD/MM/YYYY');return;}
  s.results.forEach((r,i)=>{r.buyin=parseFloat(document.getElementById('eb'+i).value)||0;r.final=parseFloat(document.getElementById('ef'+i).value)||0;});
  if(busy)return;
  const se=seasons[curSeason];
  busy=true;
  try{await DB.saveSession(se.id,s);}catch(e){saveFailed(e);return;}finally{busy=false;}
  se.sessions[editIdx]=s;editIdx=null;editData=null;renderHist();toast('Session updated');
}
async function confirmDelete(){
  if(busy)return;
  const se=seasons[curSeason];
  busy=true;
  try{await DB.deleteSession(se.id,se.sessions[editIdx].id);}catch(e){saveFailed(e);return;}finally{busy=false;}
  se.sessions.splice(editIdx,1);editIdx=null;editData=null;renderHist();toast('Session deleted');
}

// ══════════════ STATS ══════════════
// Headlines, running-total chart and players list for the current Chapter / Season choice.
// The numbers come from stats.js and are always PnL (the old points system isn't shown here).
function selSessions(){return selectSessions(DATA,VIEW,isAllTime()?-1:seasons[curSeason].number);}

// Players whose chart lines are coloured. Goes back to just the leader when the Chapter / Season changes.
let chartSel=[],chartKey=null;
let chartFit=false;   // "Fit to selected": zoom the chart to just the coloured players

function renderStats(){
  const el=document.getElementById('pnl-stats');
  const ss=selSessions();
  if(!ss.length){el.innerHTML=emptyCard('No sessions yet.');return;}
  const ps=playerStats(ss),h=headlines(ss);
  const key=VIEW+'|'+curSeason;
  if(key!==chartKey){chartKey=key;chartSel=[ps[0].name];}
  chartSel=chartSel.filter(n=>ps.some(p=>p.name===n));

  const tile=(lbl,x)=>`<div class="tile"><div class="lbl">${lbl}</div>
    <div class="money big ${cls(x.pnl)}">${money(x.pnl)}</div>
    <div class="sub">${x.player} · ${seasonTag(x.session)}</div><div class="sub" style="margin-top:0">${x.session.name}</div></div>`;
  let html=`<div class="sec-head"><h2 class="h2">Headlines</h2></div>
  <div class="tiles">${tile('Best session',h.best)}${tile('Worst session',h.worst)}</div>
  <div class="tile wide"><div style="min-width:0"><div class="lbl">Money played</div>
    <div class="sub">${h.sessions} session${h.sessions!==1?'s':''} · ${h.players} players</div></div>
    <div class="money" style="font-size:clamp(24px,7.5vw,34px)">${gbp(h.money)}</div></div>`;

  html+=`<div class="sec-head"><h2 class="h2">Running total</h2>
    <button class="fit-btn${chartFit?' on':''}" aria-pressed="${chartFit}" ${chartSel.length?'':'disabled'} onclick="chartFit=!chartFit;renderStats()">${chartFit?icon('check'):''}Fit to selected</button></div>
  <div class="card chart-card" id="run-chart">${runChart(ss,{sel:chartSel,fit:chartFit})}
    <div class="sub" style="margin-top:10px">Tap names to compare</div>
    <div class="pchips">${ps.map(p=>{const on=chartSel.includes(p.name);
      return `<button class="pchip${on?' on':''}" style="--c:${lineCol(p.name)}" aria-pressed="${on}" onclick="toggleLine('${q(p.name)}')"><span class="dot"></span>${p.name}</button>`;}).join('')}</div></div>`;

  html+=`<div class="sec-head"><h2 class="h2">Players</h2></div>
  <div class="card plist">${ps.map(p=>`<button class="prow" id="${playerRowId(p.name)}" onclick="openPlayer('${q(p.name)}')">
    ${av(p.name,40)}<span class="mid"><span class="nm">${p.name}</span><span class="sub">#${p.rank} · ${p.n} session${p.n!==1?'s':''}</span></span>
    <span class="money ${cls(round25(p.shrunk))}">${money25(p.shrunk)}</span><span class="chev">${icon('right')}</span></button>`).join('')}</div>`;
  el.innerHTML=html;
}

// Tap a chip: colour that player's line, or grey it again
function toggleLine(n){
  const i=chartSel.indexOf(n);
  if(i>=0)chartSel.splice(i,1);else chartSel.push(n);
  renderStats();
}
// Until the player page exists, tapping a player shows just their line on the chart
function openPlayer(name){
  chartSel=[name];renderStats();
  document.getElementById('run-chart')?.scrollIntoView({block:'center',behavior:'smooth'});
}

// Running-total chart, as an SVG string.
//   sel:  players drawn in their colour (thicker, with a dot at the end); everyone else is a grey line
//   only: if given, draw just these players (for one player's own chart)
//   fit:  zoom to the coloured players: the y-axis covers only their highs and lows, the x-axis only
//         the sessions from just before the first of them started to the last one they played.
//         Everyone else's grey lines are cut off at the edges.
// One season: x = session number, evenly spaced. A chapter or All time: x = real dates, with
// month labels and a dashed copper line where each season starts. Sessions on the same day sit
// a few pixels apart so a 4-session night shows as quick steps rather than one vertical jump.
const GREY_LINE='#3A3633';
let chartN=0;   // gives each chart's clipping area its own id
function runChart(ss,{sel=[],only=null,fit=false}={}){
  const byDate=isAllTime();   // true for a chapter's All seasons and for the pooled All time view
  const W=340,padL=42,padR=12,padT=byDate?20:10,padB=22,H=byDate?236:226;
  const iW=W-padL-padR,iH=H-padT-padB;

  // xs[i] = x of session i, in px from the plot's left edge. x=0 is the start, before any session.
  let xs;
  if(!byDate)xs=ss.map((_,i)=>(i+1)/ss.length*iW);
  else{
    const t0=ss[0].t,span=Math.max(ss.at(-1).t-t0,1),GAP=3;
    xs=[];ss.forEach((s,i)=>xs.push(Math.max(GAP+(s.t-t0)/span*iW,(i?xs[i-1]:0)+GAP)));
    const k=iW/xs.at(-1);xs=xs.map(x=>x*k);   // squeeze back to fit if the nudges pushed past the edge
  }

  const lines=runningTotals(ss);
  const names=only||Object.keys(lines);
  const focus=fit?sel.filter(n=>lines[n]):[];   // players the axes fit to ([] = everyone)
  const start=n=>{const o=lines[n][0].session.order;return o?xs[o-1]:0;};   // x where a line starts (£0)
  const end=n=>xs[lines[n].at(-1).session.order];
  // x range shown: everything, or just the focused players' span
  const xa=focus.length?Math.min(...focus.map(start)):0, xb=focus.length?Math.max(...focus.map(end)):xs.at(-1);
  const inX=x=>x>=xa-0.01&&x<=xb+0.01;

  // y scale: a round step so the top and bottom labels are tidy (+£150, −£100…)
  const vals=(focus.length?focus:names).flatMap(n=>lines[n].map(p=>p.total));
  const hi=Math.max(0,...vals),lo=Math.min(0,...vals);
  const step=[2,5,10,20,25,50,100,150,200,250,500,1000,2000].find(s=>s*4>=hi-lo)||5000;
  let top=Math.ceil(hi/step)*step,bot=Math.floor(lo/step)*step;
  if(top===bot)top=step;
  const X=x=>(padL+(x-xa)/(xb-xa)*iW).toFixed(1), Y=v=>(padT+(top-v)/(top-bot)*iH).toFixed(1);
  const lbl=v=>v>0?'+£'+amt(v):v<0?'−£'+amt(v):'£0';
  const txt=(x,y,t,a='end',extra='')=>`<text x="${x}" y="${y}" font-size="9" fill="var(--muted)" text-anchor="${a}" ${extra}>${t}</text>`;

  let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Running total chart">`;
  [top,0,bot].filter((v,i,a)=>a.indexOf(v)===i&&(v===0||v===top&&v>0||v===bot&&v<0))
    .forEach(v=>{svg+=txt(padL-6,+Y(v)+3,lbl(v));});
  svg+=`<line x1="${padL}" x2="${W-padR}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--border)"/>`;

  if(!byDate){
    // session numbers along the bottom (every other one if there are lots)
    const shown=ss.map((_,i)=>i).filter(i=>inX(xs[i])),every=Math.ceil(shown.length/12);
    shown.forEach((i,j)=>{if(j%every===0||j===shown.length-1)svg+=txt(X(xs[i]),H-6,i+1,'middle');});
  }else{
    // date → x, following the sessions (so labels stay in step with the nudged points)
    const pts=ss.map((s,i)=>[s.t,xs[i]]).filter((p,i,a)=>!i||p[0]!==a[i-1][0]);
    const tx=t=>{if(t<=pts[0][0])return pts[0][1];
      for(let i=1;i<pts.length;i++)if(t<=pts[i][0]){const[a,xa]=pts[i-1],[b,xb]=pts[i];return xa+(xb-xa)*(t-a)/(b-a);}
      return pts.at(-1)[1];};
    const t0=ss[0].t,tN=ss.at(-1).t,d0=new Date(t0*864e5);
    // month labels, centred in the part of each month the chart covers; a small tick where a month starts
    for(let y=d0.getUTCFullYear(),m=d0.getUTCMonth();;m++){
      const ms=Date.UTC(y,m,1)/864e5,me=Date.UTC(y,m+1,1)/864e5;
      if(ms>tN)break;
      const x1=Math.max(tx(Math.max(ms,t0)),xa),x2=Math.min(tx(Math.min(me,tN)),xb);
      if(x2<=x1)continue;
      if(ms>t0&&inX(tx(ms)))svg+=`<line x1="${X(x1)}" x2="${X(x1)}" y1="${H-padB}" y2="${H-padB+4}" stroke="var(--border)"/>`;
      const mon=new Date(ms*864e5).getUTCMonth();
      if(X(x2)-X(x1)>=20)svg+=txt(X((x1+x2)/2),H-6,MONTHS[mon]+(mon===0?' ’'+String(new Date(ms*864e5).getUTCFullYear()).slice(2):''),'middle');
    }
    // a dashed copper line where each season starts (not the first), labelled "C1 S2"
    let lastLbl=-99;
    ss.forEach((s,i)=>{
      if(!i||(ss[i-1].chapter===s.chapter&&ss[i-1].season===s.season))return;
      const x=(xs[i-1]+xs[i])/2;
      if(x<=xa||x>=xb)return;
      svg+=`<line x1="${X(x)}" x2="${X(x)}" y1="${padT}" y2="${H-padB}" stroke="var(--copper)" stroke-opacity=".45" stroke-dasharray="3 3"/>`;
      if(X(x)-lastLbl>=30){svg+=`<text x="${X(x)}" y="${padT-7}" font-size="8.5" fill="var(--copper)" text-anchor="middle">${seasonTag(s)}</text>`;lastLbl=+X(x);}
    });
  }

  // lines: each starts at £0 just before the player's first session
  // (clipped to the plot, with a little room for the end dots, so a fitted chart cuts other lines off)
  const path=n=>`M${X(start(n))},${Y(0)} `+lines[n].map(p=>`L${X(xs[p.session.order])},${Y(p.total)}`).join(' ');
  const clip='rc'+(++chartN);
  svg+=`<clipPath id="${clip}"><rect x="${padL-5}" y="${padT-5}" width="${iW+10}" height="${iH+10}"/></clipPath><g clip-path="url(#${clip})">`;
  names.filter(n=>!sel.includes(n)).forEach(n=>{
    svg+=`<path d="${path(n)}" fill="none" stroke="${GREY_LINE}" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/>`;});
  sel.filter(n=>lines[n]).forEach(n=>{const c=lineCol(n),e=lines[n].at(-1);
    svg+=`<path d="${path(n)}" fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${X(xs[e.session.order])}" cy="${Y(e.total)}" r="3.6" fill="${c}"/>`;});
  return svg+`</g></svg>`;
}

// ══════════════ RULES ══════════════
function renderRules(){
  const el=document.getElementById('pnl-rules');const isPnl=SYS==='pnl';
  let html=`<button class="link back" onclick="goTab(rulesFrom)">${icon('left')}${rulesFrom==='lb'?'Table':'More'}</button>`;
  if(isPnl){
    html+=`<div class="card"><h2 class="h2">How scoring works</h2>
      <p class="prose">Your score for a session is simply <strong>final chips − total buy-in</strong>. No multipliers, no brackets, no rebuy penalties. Win money, score positive. Lose money, score negative.</p></div>
    <div class="card"><h2 class="h2">The standings</h2>
      <p class="prose">Ranked by <strong>total PnL ÷ (sessions played + ${K})</strong>.</p>
      <div class="inset prose" style="margin-top:12px">Everyone is treated as though they'd also played ${K} break-even sessions. Play once and those ${K} imaginary sessions dominate, so you sit near £0. Play the whole season and they barely matter. This stops someone winning big on their debut and topping the table above a season-long grinder.</div>
      <div class="inset prose"><strong>Example.</strong> +£348.25 across 10 sessions → 348.25 ÷ 13 = <strong>+£26.79</strong>. One session of <span style="white-space:nowrap">−£20</span> → −20 ÷ 4 = <strong>−£5</strong>.</div></div>
    <div class="card"><h2 class="h2">Buy-ins and rebuys</h2>
      <p class="prose">Everyone starts with <strong>£20</strong>. If you bust, rebuy for any amount between <strong>£20</strong> and the <strong>largest stack at the table</strong>.</p>
      <div class="inset prose" style="margin-top:12px;font-size:13px">Buying in for more than the biggest stack is pointless: the excess can never be won or lost. The table sets the limit; no house rule needed.</div></div>`;
  } else {
    const brackets=[[0,'0x'],[5,'0.5x'],[8,'0.8x'],[10,'1x'],[13,'1.2x'],[16,'1.5x'],[19,'2x'],[22,'2.5x'],[25,'3x'],[30,'4x'],[35,'5x+']];
    const rb=[['0 rebuys','£20','×1.0'],['1 rebuy','£40','×1.0'],['2 rebuys','£60','×0.9'],['3 rebuys','£80','×0.5'],['4 rebuys','£100','×0.25'],['5+ rebuys','£120+','halves each time']];
    html+=`<div class="card"><h2 class="h2">Old system (reference only)</h2>
      <p class="prose">Multiplier = final ÷ buy-in, mapped to bracket points with interpolation, then multiplied by a rebuy penalty. Retired after Season 1.</p></div>
    <div class="card"><h2 class="h2" style="margin-bottom:8px">Multiplier to points</h2>
      ${brackets.map(([p,m])=>`<div class="row" style="padding:6px 0"><span class="sub" style="width:40px;font-weight:500">${m}</span><span class="badge">${m==='5x+'?'∞':p}</span></div>`).join('')}</div>
    <div class="card"><h2 class="h2" style="margin-bottom:8px">Rebuy penalty</h2>
      ${rb.map(([n,s,m])=>`<div class="row" style="padding:8px 0"><span style="min-width:84px">${n}</span><span class="sub" style="min-width:48px">${s}</span><span style="font-weight:500">${m}</span></div>`).join('')}</div>
    <div class="card" style="border-color:var(--down)"><h2 class="h2 down">Why it was retired</h2>
      <p class="prose">Points floor at zero. Kathiir's Session 9 (£100 in, £19.75 out, <strong>−£80.25</strong>) scored <strong>0 points</strong>, indistinguishable from a mildly bad night. Sixteen hand-tuned constants doing what PnL does with none.</p></div>`;
  }
  el.innerHTML=html;
}

startWhenDbReady();
