function renderHist(){
  const el=document.getElementById('pnl-hist');
  const SS=curSessions();
  if(SS.length===0){el.innerHTML=emptyCard('No sessions yet.');return;}
  if(editIdx!==null&&editData){renderEdit(el);return;}
  const editable=canEdit();
  let html=editable?'':`<div class="notice">${icon('lock')}<span>${readOnlyMsg()}</span></div>`;
  [...SS].reverse().forEach((s,ri)=>{
    const idx=SS.length-1-ri;
    const rows=s.results.map(r=>({...r,p:pnl(r)})).sort((a,b)=>b.p-a.p);
    const pot=rows.reduce((a,r)=>a+r.buyin,0);
    html+=`<div class="card">
      <div class="spread" style="align-items:center;margin-bottom:12px">
        <div style="min-width:0"><div style="font-weight:600;font-size:16px">${s.name}</div>
          <div class="sub">${s._season?s._season+' · ':''}${s.date} · ${gbp(pot)} in play</div></div>
        ${editable?`<button class="btn-ghost btn-sm" onclick="openEdit(${idx})">${icon('pencil')}Edit</button>`:''}
      </div>
      <div class="grid-res head"><span>Player</span><span class="c">In</span><span class="c">Out</span><span class="r">P&amp;L</span></div>
      ${rows.map((r,i)=>{
        return `<div class="grid-res">
          <div class="who">${rank(i)}${av(r.player,22)}<span class="${place(i,rows.length)}" style="font-size:13px">${r.player}</span></div>
          <span class="sub c">${gbp(r.buyin)}</span>
          <span class="sub c">${gbp(r.final)}</span>
          <span class="r" style="font-size:13px"><span class="money ${cls(r.p)}">${money(r.p)}</span></span></div>`;}).join('')}
    </div>`;
  });
  el.innerHTML=html;
}
function openEdit(idx){editIdx=idx;editData=JSON.parse(JSON.stringify(curSessions()[idx]));renderHist();}
function renderEdit(el){
  const s=editData;
  el.innerHTML=`<div class="card">
    <div class="spread" style="align-items:center;margin-bottom:14px">
      <h2 class="h2" style="margin:0">Edit ${s.name}</h2>
      <button class="icon-btn" onclick="editIdx=null;editData=null;renderHist()" aria-label="Close">${icon('x')}</button></div>
    <div class="two-col" style="margin-bottom:14px">
      <div><div class="field-lbl">Name</div><input id="e-name" value="${s.name}" maxlength="60"></div>
      <div><div class="field-lbl">Date</div><input id="e-date" value="${s.date}"></div></div>
    <div class="grid-res grid-edit head"><span>Player</span><span class="c">Buy-in</span><span class="c">Final</span><span class="r">P&amp;L</span></div>
    ${s.results.map((r,i)=>`<div class="grid-res grid-edit">
      <div class="who">${av(r.player,22)}<span>${r.player}</span></div>
      <input type="number" id="eb${i}" value="${r.buyin}" min="0" step="5" inputmode="decimal" class="c" oninput="liveEdit(${i})">
      <input type="number" id="ef${i}" value="${r.final}" min="0" step="0.25" inputmode="decimal" class="c" oninput="liveEdit(${i})">
      <span id="ep${i}" class="money r ${cls(pnl(r))}">${money(pnl(r))}</span></div>`).join('')}
    <div id="edit-actions" style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
      <button class="btn-danger" onclick="askDelete(true)">Delete</button>
      <span style="flex:1"></span>
      <button class="btn-ghost" onclick="editIdx=null;editData=null;renderHist()">Cancel</button>
      <button class="btn" onclick="saveEdit()">Save changes</button></div>
    <div id="delete-confirm" class="confirm" hidden>
      <p style="margin-bottom:12px">Delete <strong>${s.name}</strong>? It disappears from the app for everyone, but is kept in the database so it can be restored.</p>
      <div style="display:flex;gap:8px"><button class="btn-ghost" onclick="askDelete(false)">Keep it</button>
      <button class="btn-danger solid" onclick="confirmDelete()">Yes, delete</button></div></div></div>`;
}
// Show or hide the delete confirmation without re-rendering, so typed edits aren't lost
function askDelete(on){
  document.getElementById('delete-confirm').hidden=!on;
  document.getElementById('edit-actions').hidden=on;
}
function liveEdit(i){const b=parseFloat(document.getElementById('eb'+i).value)||0;const f=parseFloat(document.getElementById('ef'+i).value)||0;
  const v=f-b;const el=document.getElementById('ep'+i);el.textContent=money(v);el.className='money r '+cls(v);}
async function saveEdit(){
  const s=editData;const n=document.getElementById('e-name').value.trim();const d=document.getElementById('e-date').value.trim();
  if(n)s.name=n;if(d)s.date=d;
  if(!DATE_RE.test(s.date)){toast('Date must be DD/MM/YYYY');return;}
  s.results.forEach((r,i)=>{r.buyin=parseFloat(document.getElementById('eb'+i).value)||0;r.final=parseFloat(document.getElementById('ef'+i).value)||0;});
  if(busy)return;
  const se=seasons[curSeason];
  busy=true;
  try{await DB.saveSession(se.id,s);}catch(e){saveFailed(e);return;}finally{busy=false;}
  se.sessions[editIdx]=s;editIdx=null;editData=null;renderHist();toast('Session updated');
}
async function confirmDelete(){
  if(busy)return;
  const se=seasons[curSeason];
  busy=true;
  try{await DB.deleteSession(se.id,se.sessions[editIdx].id);}catch(e){saveFailed(e);return;}finally{busy=false;}
  se.sessions.splice(editIdx,1);editIdx=null;editData=null;renderHist();toast('Session deleted');
}

// ══════════════ STATS ══════════════
// Headlines, running-total chart and players list for the current Chapter / Season choice.
// The numbers come from stats.js.
function selSessions(){return selectSessions(DATA,VIEW,isAllTime()?-1:seasons[curSeason].number);}

// Players whose chart lines are coloured. Goes back to just the leader when the Chapter / Season changes.
let chartSel=[],chartKey=null;
let chartFit=false;   // "Fit to selected": zoom the chart to just the coloured players
let chartEnds=false;  // "End values" (running total): label where each coloured player finished
let chartAvg=false;   // "Show shrunk avg" (per session): a dashed line at each coloured player's shrunk average

function renderStats(){
  const el=document.getElementById('pnl-stats');
  const ss=selSessions();
  if(!ss.length){el.innerHTML=emptyCard('No sessions yet.');return;}
  const ps=playerStats(ss),h=headlines(ss);
  const key=VIEW+'|'+curSeason;
  if(key!==chartKey){chartKey=key;chartSel=[ps[0].name];}
  chartSel=chartSel.filter(n=>ps.some(p=>p.name===n));

  const tile=(lbl,x)=>`<div class="tile"><div class="lbl">${lbl}</div>
    ${bigMoney(money(x.pnl),cls(x.pnl))}
    <div class="sub">${x.player} · ${seasonTag(x.session)}</div><div class="sub" style="margin-top:0">${x.session.name}</div></div>`;
  let html=`<div class="sec-head"><h2 class="h2">Headlines</h2></div>
  <div class="tiles">${tile('Best session',h.best)}${tile('Worst session',h.worst)}</div>
  <div class="tile wide"><div style="min-width:0"><div class="lbl">Money played</div>
    <div class="sub">${h.sessions} session${h.sessions!==1?'s':''} · ${h.players} players</div></div>
    <div class="money" style="font-size:clamp(24px,7.5vw,34px)">${gbp(h.money)}</div></div>`;

  const opt=(on,label,flip)=>`<button class="fit-btn${on?' on':''}" aria-pressed="${on}" ${chartSel.length?'':'disabled'} onclick="changeChart(()=>{${flip}})">${on?icon('check'):''}${label}</button>`;
  html+=`<div class="sec-head chart-head">${chartToggle()}</div>
  <div class="card chart-card" id="run-chart">${lineChart(ss,statsOpts())}
    <div class="chart-opts">${opt(chartFit,'Fit to selected','chartFit=!chartFit')}${chartMode==='run'?opt(chartEnds,'End values','chartEnds=!chartEnds'):opt(chartAvg,'Show shrunk avg','chartAvg=!chartAvg')}</div>
    <div class="sub" style="margin-top:12px">Tap names to compare</div>
    <div class="pchips">${ps.map(p=>{const on=chartSel.includes(p.name);
      return `<button class="pchip${on?' on':''}" style="--c:${lineCol(p.name)}" aria-pressed="${on}" onclick="toggleLine('${q(p.name)}')"><span class="dot"></span>${p.name}</button>`;}).join('')}</div></div>`;

  html+=`<div class="sec-head"><h2 class="h2">Players</h2></div>
  <div class="card plist">${ps.map(p=>`<button class="prow" onclick="openPlayer('${q(p.name)}')">
    ${av(p.name,40)}<span class="mid"><span class="nm">${p.name}</span><span class="sub">#${p.rank} · ${p.n} session${p.n!==1?'s':''}</span></span>
    <span class="money ${cls(round25(p.shrunk))}">${money25(p.shrunk)}</span><span class="chev">${icon('right')}</span></button>`).join('')}</div>`;
  el.innerHTML=html;
  statsView=lineChart.drawn;
}

// Tap a chip: colour that player's line, or grey it again
function toggleLine(n){
  changeChart(()=>{const i=chartSel.indexOf(n);if(i>=0)chartSel.splice(i,1);else chartSel.push(n);});
}
function statsOpts(){return {mode:chartMode,sel:[...chartSel],fit:chartFit,ends:chartEnds,avg:chartAvg};}
// Change the Stats chart smoothly instead of jumping: the axes glide to their new range (0.5s), the
// plot narrows or widens for the right-hand labels, End values / shrunk averages fade in or out, and
// each newly coloured line draws itself in over its own 0.7s. These run side by side: tap three names
// quickly and all three draw in together, each finishing in its own time. One loop redraws the chart
// each frame while anything is still moving, then stops.
let statsView=null;   // the view (zoom, plot width) of the Stats chart currently on screen
let chartGlide=null;  // the axis glide in progress: {from, to, t0, endsOff, avgOff, extrasOn}
const drawing=new Map();   // lines drawing themselves in: name → start time
let chartLoop=false;  // the redraw loop is running
const GLIDE_MS=500,DRAW_MS=700;
function changeChart(apply){
  const before=statsOpts(),from=statsView;
  apply();renderStats();
  const after=statsOpts(),to=lineChart.last,now=performance.now();
  if(!from||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  after.sel.filter(n=>!before.sel.includes(n)).forEach(n=>drawing.set(n,now));
  chartGlide={from,to,t0:now,endsOff:before.ends&&!after.ends,avgOff:before.avg&&!after.avg,
    extrasOn:(!before.ends&&after.ends)||(!before.avg&&after.avg)};
  if(!chartLoop){chartLoop=true;chartFrame(now);}   // first frame straight away, so the new state never flashes
}
function chartFrame(now){
  const svg=document.querySelector('#run-chart > svg');
  if(!svg||TAB!=='stats'){chartLoop=false;chartGlide=null;drawing.clear();return;}
  const o=statsOpts();
  // the axis glide: ease in and out
  if(chartGlide){
    const g=chartGlide,k=Math.min((now-g.t0)/GLIDE_MS,1),t=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    if(k<1)Object.assign(o,{view:lerpView(g.from,g.to,t),ends:o.ends||g.endsOff,avg:o.avg||g.avgOff,
      extraA:g.endsOff||g.avgOff?1-t:g.extrasOn?t:1});
    else chartGlide=null;
  }
  // each drawing line: ease out, like a pen slowing at the end
  const draws={};
  drawing.forEach((t0,n)=>{const k=Math.min((now-t0)/DRAW_MS,1);
    if(k>=1||!o.sel.includes(n))drawing.delete(n);else draws[n]=1-Math.pow(1-k,3);});
  svg.outerHTML=lineChart(selSessions(),{...o,draws});
  statsView=lineChart.drawn;
  if(chartGlide||drawing.size)requestAnimationFrame(chartFrame);else chartLoop=false;
}
// In-between view, t of the way from a to b. The old gridlines (a.step) fade out as the new ones fade in.
function lerpView(a,b,t){const v={...b,stepFrom:a.step,t};['padR','fa','fb','top','bot'].forEach(k=>{v[k]=a[k]+(b[k]-a[k])*t;});return v;}
// Which chart Stats and the player page show: 'run' = running total, 'form' = PnL in each session
let chartMode='run';
function setChartMode(m){chartMode=m;chartFade=true;render();chartFade=false;}   // the two charts are too different to morph, so crossfade
let chartFade=false;
// The Running total | Per session switch
function chartToggle(){
  return `<div class="seg"><button class="${chartMode==='run'?'on':''}" aria-pressed="${chartMode==='run'}" onclick="setChartMode('run')">Running total</button>
    <button class="${chartMode==='form'?'on':''}" aria-pressed="${chartMode==='form'}" onclick="setChartMode('form')">Per session</button></div>`;
}

// Line chart, as an SVG string. mode 'run': each player's running total, starting from £0 just
// before their first session. mode 'form': their PnL in each session, with a dot on every session;
// the line breaks where they missed a session (a lone session is just a dot).
//   sel:  players drawn in their colour (thicker, with a dot at the end); everyone else is a grey line
//   only: if given, draw just these players (for one player's own chart)
//   fit:  zoom to the coloured players: the y-axis covers only their highs and lows, the x-axis only
//         the sessions from their first (just before it, for a running total) to their last.
//         Everyone else's grey lines are cut off at the edges.
//   ends: running total only. Label where each coloured player finished, in a strip down the right
//         edge, nudged apart so labels don't overlap.
//   avg:  per session only. A dashed line in each coloured player's colour at their shrunk average
//         (the number in the Players list), labelled in the same right-hand strip.
// For animating (changeChart): view = the in-between view to draw instead of the one these options
// would give; extraA = opacity of the End values / averages; draws = lines drawing themselves in,
// {name: how far, 0–1}. lineChart.last = the view these options give; lineChart.drawn = what was drawn.
// One season: x = session number, evenly spaced. A chapter or All time: x = real dates, with
// month labels and a dashed copper line where each season starts. Sessions on the same day sit
// a few pixels apart so a 4-session night shows as quick steps rather than one vertical jump.
const GREY_LINE='#3A3633';
let chartN=0;   // gives each chart's clipping area its own id
function lineChart(ss,{mode='run',sel=[],only=null,fit=false,ends=false,avg=false,view=null,extraA=1,draws={}}={}){
  const run=mode==='run';
  const showEnds=ends&&run,showAvg=avg&&!run;
  const shrunk=showAvg?Object.fromEntries(playerStats(ss).map(p=>[p.name,p.shrunk])):{};
  const byDate=isAllTime();   // true for a chapter's All seasons and for the pooled All time view
  const padRT=showEnds||showAvg?60:12;
  const W=340,padL=42,padR=view?view.padR:padRT,padT=byDate?20:10,padB=22,H=byDate?236:226;
  const iW=W-padL-padR,iH=H-padT-padB;

  // xs[i] = x of session i, in px from the plot's left edge. x=0 is the start, before any session.
  let xs;
  if(!byDate)xs=ss.map((_,i)=>(i+1)/ss.length*iW);
  else{
    const t0=ss[0].t,span=Math.max(ss.at(-1).t-t0,1),GAP=3;
    xs=[];ss.forEach((s,i)=>xs.push(Math.max(GAP+(s.t-t0)/span*iW,(i?xs[i-1]:0)+GAP)));
    const k=iW/xs.at(-1);xs=xs.map(x=>x*k);   // squeeze back to fit if the nudges pushed past the edge
  }

  // lines[name] = [{o: session index, v: value}] for the sessions they played
  const raw=run?runningTotals(ss):sessionPnls(ss);
  const lines=Object.fromEntries(Object.entries(raw).map(([n,l])=>[n,l.map(p=>({o:p.session.order,v:run?p.total:p.pnl}))]));
  const names=only||Object.keys(lines);
  const focus=fit?sel.filter(n=>lines[n]):[];   // players the axes fit to ([] = everyone)
  // x where a line starts: a running total starts at £0 just before the first session played
  const start=n=>{const o=lines[n][0].o;return run?(o?xs[o-1]:0):xs[o];};
  const end=n=>xs[lines[n].at(-1).o];
  // x range shown: everything, or just the focused players' span (widened if it's a single session)
  let xa=focus.length?Math.min(...focus.map(start)):0, xb=focus.length?Math.max(...focus.map(end)):xs.at(-1);
  if(xb-xa<1){xa-=12;xb+=12;}

  // y scale: a round step so the top and bottom labels are tidy (+£150, −£100…)
  const vals=(focus.length?focus:names).flatMap(n=>lines[n].map(p=>p.v));
  const hi=Math.max(0,...vals),lo=Math.min(0,...vals);
  const step=[2,5,10,20,25,50,100,150,200,250,500,1000,2000].find(s=>s*4>=hi-lo)||5000;
  let top=Math.ceil(hi/step)*step,bot=Math.floor(lo/step)*step;
  if(top===bot)top=step;
  // the view: x range as fractions of the plot width (so it survives the plot changing width), y range, step
  lineChart.last={padR:padRT,fa:xa/iW,fb:xb/iW,top,bot,step};
  if(view){xa=view.fa*iW;xb=view.fb*iW;top=view.top;bot=view.bot;}
  lineChart.drawn={padR,fa:xa/iW,fb:xb/iW,top,bot,step};
  const inX=x=>x>=xa-0.01&&x<=xb+0.01;
  const X=x=>(padL+(x-xa)/(xb-xa)*iW).toFixed(1), Y=v=>(padT+(top-v)/(top-bot)*iH).toFixed(1);
  const lbl=v=>v>0?'+£'+amt(v):v<0?'−£'+amt(v):'£0';
  const txt=(x,y,t,a='end',extra='')=>`<text x="${x}" y="${y}" font-size="9" fill="var(--muted)" text-anchor="${a}" ${extra}>${t}</text>`;

  let svg=`<svg${chartFade?' class="chart-fade"':''} viewBox="0 0 ${W} ${H}" role="img" aria-label="${run?'Running total':'Per session'} chart">`;
  // a labelled line at every step (about 4 or 5 of them): solid at £0, faint and dashed elsewhere.
  // Mid-animation between two step sizes the sets crossfade (shared values like £0 stay solid):
  const tickSet=st=>{const out=[];for(let v=Math.ceil(bot/st-1e-9)*st;v<=top+1e-9;v+=st)out.push(Math.round(v*100)/100);return out;};
  const ticksNew=tickSet(step),ticksOld=view&&view.stepFrom&&view.stepFrom!==step?tickSet(view.stepFrom):[];
  // old ones fade out over the first half, new ones fade in once the range is nearly there
  const tt=view?view.t:1,oldA=Math.max(0,1-2*tt),newA=Math.min(1,Math.max(0,(tt-.4)/.6));
  [...ticksNew.map(v=>[v,ticksOld.length&&!ticksOld.includes(v)?newA:1]),...ticksOld.filter(v=>!ticksNew.includes(v)).map(v=>[v,oldA])]
    .forEach(([v,a])=>{
      if(a<.02)return;
      svg+=`<g opacity="${a.toFixed(2)}">`+txt(padL-6,+Y(v)+3,lbl(v));
      svg+=(v===0?`<line x1="${padL}" x2="${W-padR}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--border)"/>`
        :`<line x1="${padL}" x2="${W-padR}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--border)" stroke-opacity=".7" stroke-dasharray="2 4"/>`)+`</g>`;
    });

  if(!byDate){
    // session numbers along the bottom (every other one if there are lots)
    const shown=ss.map((_,i)=>i).filter(i=>inX(xs[i])),every=Math.ceil(shown.length/12);
    shown.forEach((i,j)=>{if(j%every===0||j===shown.length-1)svg+=txt(X(xs[i]),H-6,i+1,'middle');});
  }else{
    // date → x, following the sessions (so labels stay in step with the nudged points)
    const pts=ss.map((s,i)=>[s.t,xs[i]]).filter((p,i,a)=>!i||p[0]!==a[i-1][0]);
    const tx=t=>{if(t<=pts[0][0])return pts[0][1];
      for(let i=1;i<pts.length;i++)if(t<=pts[i][0]){const[a,xa]=pts[i-1],[b,xb]=pts[i];return xa+(xb-xa)*(t-a)/(b-a);}
      return pts.at(-1)[1];};
    const t0=ss[0].t,tN=ss.at(-1).t,d0=new Date(t0*864e5);
    // month labels, centred in the part of each month the chart covers; a small tick where a month starts
    for(let y=d0.getUTCFullYear(),m=d0.getUTCMonth();;m++){
      const ms=Date.UTC(y,m,1)/864e5,me=Date.UTC(y,m+1,1)/864e5;
      if(ms>tN)break;
      const x1=Math.max(tx(Math.max(ms,t0)),xa),x2=Math.min(tx(Math.min(me,tN)),xb);
      if(x2<=x1)continue;
      if(ms>t0&&inX(tx(ms)))svg+=`<line x1="${X(x1)}" x2="${X(x1)}" y1="${H-padB}" y2="${H-padB+4}" stroke="var(--border)"/>`;
      const mon=new Date(ms*864e5).getUTCMonth();
      if(X(x2)-X(x1)>=20)svg+=txt(X((x1+x2)/2),H-6,MONTHS[mon]+(mon===0?' ’'+String(new Date(ms*864e5).getUTCFullYear()).slice(2):''),'middle');
    }
    // a dashed copper line where each season starts (not the first), labelled "C1 S2"
    let lastLbl=-99;
    ss.forEach((s,i)=>{
      if(!i||(ss[i-1].chapter===s.chapter&&ss[i-1].season===s.season))return;
      const x=(xs[i-1]+xs[i])/2;
      if(x<=xa||x>=xb)return;
      svg+=`<line x1="${X(x)}" x2="${X(x)}" y1="${padT}" y2="${H-padB}" stroke="var(--copper)" stroke-opacity=".45" stroke-dasharray="3 3"/>`;
      if(X(x)-lastLbl>=30){svg+=`<text x="${X(x)}" y="${padT-7}" font-size="8.5" fill="var(--copper)" text-anchor="middle">${seasonTag(s)}</text>`;lastLbl=+X(x);}
    });
  }

  // Draw the lines, clipped to the plot (with a little room for the dots and their halos) so a fitted chart cuts
  // other lines off at the edges. A running total is one line from £0; a per-session line is split
  // into runs of back-to-back sessions, and a run of one is drawn as a dot.
  const pt=p=>`${X(xs[p.o])},${Y(p.v)}`;
  const runs=n=>{const out=[];lines[n].forEach((p,i,l)=>{if(!i||(!run&&p.o!==l[i-1].o+1))out.push([]);out.at(-1).push(p);});return out;};
  // dT = how far a line has drawn itself in (undefined = fully drawn); its dots appear near the end
  const dotA=dT=>dT===undefined?1:Math.min(Math.max((dT-.6)/.4,0),1);
  const draw=(n,colour,width,dotR,dT)=>{let g='';const anim=dT!==undefined;
    const a=anim?` pathLength="1" stroke-dasharray="1" stroke-dashoffset="${(1-dT).toFixed(3)}"`:'',ad=anim?` opacity="${dotA(dT).toFixed(3)}"`:'';
    runs(n).forEach((r,i)=>{
      const d=(run&&i===0?`M${X(start(n))},${Y(0)} L`:'M')+r.map(pt).join(' L');
      if(r.length>1||run)g+=`<path${a} d="${d}" fill="none" stroke="${colour}" stroke-width="${width}" stroke-linejoin="round" stroke-linecap="round"/>`;
      else g+=`<circle${ad} cx="${X(xs[r[0].o])}" cy="${Y(r[0].v)}" r="${dotR}" fill="${colour}"/>`;});
    return g;};
  const clip='rc'+(++chartN);
  // glow for coloured lines: a soft blur of the line itself underneath it (whole-chart region, so flat lines keep it)
  svg+=`<clipPath id="${clip}"><rect x="${padL-9}" y="${padT-9}" width="${iW+18}" height="${iH+18}"/></clipPath>
    <filter id="${clip}g" filterUnits="userSpaceOnUse" x="0" y="0" width="${W}" height="${H}"><feGaussianBlur stdDeviation="2.2" result="b"/>
      <feComponentTransfer in="b" result="s"><feFuncA type="linear" slope=".6"/></feComponentTransfer><feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <g clip-path="url(#${clip})">`;
  names.filter(n=>!sel.includes(n)).forEach(n=>{svg+=draw(n,GREY_LINE,1.3,1.8);});
  sel.filter(n=>lines[n]).forEach(n=>{const c=lineCol(n),dT=draws[n],anim=dT!==undefined,ad=anim?` opacity="${dotA(dT).toFixed(3)}"`:'';
    svg+=`<g filter="url(#${clip}g)">`+draw(n,c,2.4,2.8,dT);
    // dots: just the end of a running total (with a soft halo); every session for per-session
    if(run){const e=lines[n].at(-1);svg+=`<circle cx="${X(xs[e.o])}" cy="${Y(e.v)}" r="7.5" fill="${c}" opacity="${(.18*dotA(dT)).toFixed(3)}"/>`;}
    (run?[lines[n].at(-1)]:lines[n]).forEach(p=>{svg+=`<circle${ad} cx="${X(xs[p.o])}" cy="${Y(p.v)}" r="${run?3.6:2.8}" fill="${c}"/>`;});
    svg+=`</g>`;
    // a running total that stopped early stays at its final value: a dotted line carries it to the edge
    if(showEnds&&end(n)<xb)svg+=`<line opacity="${extraA}" x1="${X(end(n))}" x2="${W-padR}" y1="${Y(lines[n].at(-1).v)}" y2="${Y(lines[n].at(-1).v)}" stroke="${c}" stroke-opacity=".6" stroke-dasharray="1.5 3"/>`;});
  // shrunk-average lines, across the whole plot
  if(showAvg)sel.filter(n=>lines[n]).forEach(n=>{
    svg+=`<line opacity="${extraA}" x1="${padL}" x2="${W-padR}" y1="${Y(shrunk[n])}" y2="${Y(shrunk[n])}" stroke="${lineCol(n)}" stroke-width="1.4" stroke-dasharray="5 4"/>`;});
  svg+=`</g>`;
  if(showEnds||showAvg){
    // right-hand labels: start at each value, then push apart (at least 11px) and keep inside
    const labs=sel.filter(n=>lines[n]).map(n=>{const v=showEnds?lines[n].at(-1).v:shrunk[n];return {n,v,y:+Y(v)};}).sort((a,b)=>a.y-b.y);
    labs.forEach((l,i)=>{l.y=Math.max(l.y,padT+4,i?labs[i-1].y+11:0);});
    for(let i=labs.length-1;i>=0;i--)labs[i].y=Math.min(labs[i].y,H-padB-2-(labs.length-1-i)*11);
    labs.forEach(l=>{svg+=`<text opacity="${extraA}" x="${W-padR+6}" y="${(l.y+3.5).toFixed(1)}" font-size="9.5" font-weight="600" fill="${lineCol(l.n)}">${money25(l.v)}</text>`;});
  }
  return svg+`</svg>`;
}

// ══════════════ PLAYER PAGE ══════════════
// One player's stats for the current Chapter / Season choice: headline tiles, best and worst
// session, their running total, and rivals. Opened by tapping a player on the Table or Stats.
let playerName=null;
let playerFrom='stats';   // tab the Back link returns to

function openPlayer(name){
  if(TAB!=='player')playerFrom=TAB==='lb'?'lb':'stats';   // hopping rival to rival keeps the original Back
  playerName=name;
  goTab('player');
}
// "All time", "Chapter 1" or "C2 · S2": what the numbers on the page cover
function scopeLabel(){
  if(VIEW==='all')return 'All time';
  const c=VIEW==='era-1'?1:2;
  return isAllTime()?`Chapter ${c}`:`C${c} · S${seasons[curSeason].number}`;
}
// Open Stats with just this player's line coloured
function compareOnStats(name){
  chartKey=VIEW+'|'+curSeason;chartSel=[name];
  goTab('stats');
  document.getElementById('run-chart')?.scrollIntoView({block:'center'});
}

function renderPlayer(){
  const el=document.getElementById('pnl-player');
  const ss=selSessions(),ps=playerStats(ss),p=ps.find(x=>x.name===playerName);
  const back=`<button class="link back" style="margin:0" onclick="goTab('${playerFrom}')">${icon('left')}${playerFrom==='lb'?'Table':'Stats'}</button>`;
  if(!p){el.innerHTML=`<div class="pp-top">${back}</div>`+emptyCard(`${playerName} hasn't played in this selection.`);return;}
  const n=p.n,s=x=>x!==1?'s':'';

  const aw=awardsOf(p.name);   // awards from every season, whatever is selected
  const where=VIEW==='all'?'all time':`in ${scopeLabel()}`;
  let html=`<div class="pp-top">${back}${aw.length?`<button class="awards-btn" onclick="openAwards('${q(p.name)}')">${icon('trophy')}Awards · ${aw.filter(a=>a.status==='locked').length}</button>`:''}</div>
  <div class="pp-head">${av(p.name,64,p.rank===1?'ring':'')}
    <div class="mid"><h1 class="title">${p.name}</h1>
      <div class="sub" style="font-size:14px;margin-top:6px">#${p.rank} ${where} · ${n} session${s(n)}</div></div></div>
  <div class="tiles">
    <div class="tile"><div class="lbl">Average (ranked)</div>${bigMoney(money25(p.shrunk),cls(round25(p.shrunk)))}</div>
    <div class="tile"><div class="lbl">Total</div>${bigMoney(money25(p.pnlTot),cls(round25(p.pnlTot)))}</div>
    <div class="tile"><div class="lbl">In profit</div><div class="money big">${p.inProfit} <small>of ${n}</small></div></div>
    <div class="tile"><div class="lbl">Topped the table</div><div class="money big">${p.topped} <small>time${s(p.topped)}</small></div></div>
  </div>
  <div class="card" style="padding:4px 16px;margin:4px 0 22px">
    <div class="bw-row"><div><div style="font-weight:600">Best session</div><div class="sub">${sessionTag(p.best.session)}</div></div>
      <span class="money ${cls(p.best.pnl)}" style="font-size:18px">${money(p.best.pnl)}</span></div>
    ${n>=2?`<div class="bw-row"><div><div style="font-weight:600">Worst session</div><div class="sub">${sessionTag(p.worst.session)}</div></div>
      <span class="money ${cls(p.worst.pnl)}" style="font-size:18px">${money(p.worst.pnl)}</span></div>`:''}
  </div>
  <div class="sec-head chart-head">${chartToggle()}</div>
  <div class="card chart-card">${lineChart(ss,{mode:chartMode,sel:[p.name],only:[p.name],fit:true,ends:true,avg:true})}
    <div class="spread" style="align-items:center;margin-top:8px">
      <span class="sub"><span class="swatch" style="background:${lineCol(p.name)}"></span>${p.name}${chartMode==='form'?' · dashed = shrunk avg':''}</span>
      <button class="link" style="font-size:13px" onclick="compareOnStats('${q(p.name)}')">Compare on Stats</button></div></div>`;

  // Rivals: opponents they've shared 3+ sessions with, worst first. Hidden until there are any.
  const rv=rivals(ss)[p.name];
  if(rv){
    const per=r=>`${money25(r.avg)} a game · ${r.n} games`;
    const card=(r,label,tone)=>`<button class="rival-card ${tone}" onclick="openPlayer('${q(r.opp)}')">
      <div class="lbl">${label}</div><div class="who">${av(r.opp,32)}<span>${r.opp}</span></div><div class="sub">${per(r)}</div></button>`;
    // The worst rival is a "Nemesis" if they beat this player on average; if this player beats
    // everyone it's just their "Toughest challenge". Likewise the best rival is a "Favourite customer"
    // only if this player actually beats them.
    const worst=rv[0],best=rv.at(-1);
    const worstCard=worst.avg<0?card(worst,'Nemesis','bad'):card(worst,'Toughest challenge','');
    const bestCard=best.avg>0?card(best,'Favourite customer','good'):card(best,'Favourite customer? Yeah right','');
    const maxAbs=Math.max(...rv.map(r=>Math.abs(r.avg)),0.01);
    html+=`<div class="sec-head" style="margin-bottom:2px"><h2 class="h2">Rivals</h2><button class="link" style="font-size:13px" onclick="openRivalAnalysis('${q(p.name)}')">See the working</button></div>
    <p class="sub" style="margin:0 2px 10px">Average difference per shared session · 3+ games together</p>
    <div class="${rv.length>1?'tiles':''}" style="margin-bottom:10px">${rv.length>1?worstCard+bestCard:(worst.avg<0?worstCard:bestCard)}</div>
    <div class="card plist">${rv.map(r=>{const w=Math.abs(r.avg)/maxAbs*50,c=cls(round25(r.avg));
      return `<button class="rv-row" onclick="openPlayer('${q(r.opp)}')">${av(r.opp,32)}
        <span style="min-width:0"><span class="nm">${r.opp}</span><span class="sub" style="display:block">${r.n} games</span></span>
        <span class="st-bar centred"><span class="${c}" style="${r.avg>=0?'left':'right'}:50%;width:${w}%"></span></span>
        <span class="money r ${c}" style="font-size:15px">${money25(r.avg)}</span></button>`;}).join('')}</div>`;
  }
  el.innerHTML=html;
}

// ══════════════ RIVAL ANALYSIS ══════════════
// The working behind the Rivals numbers. Pick a player, tap one of their rivals, and see every
// session the two both played: each one's in → out and P&L, the gap, and the average at the bottom.
// Uses the Chapter / Season pickers, which show above it. Opened from More, or from
// "See the working" on a player page.
let rivalOf=null;        // player whose rivals are listed
let rivalOpen=null;      // rival whose table is expanded
let rivalsFrom='more';   // tab the Back link returns to
function openRivalAnalysis(name){
  rivalsFrom=TAB==='player'?'player':'more';
  rivalOf=name||null;rivalOpen=null;
  goTab('rivals');
}
function pickRivalOf(name){rivalOf=name;rivalOpen=null;renderRivals();}
// revealKey: the thing just opened, so only it animates (the screen is redrawn on every tap)
let revealKey=null;
function reveal(k,draw){revealKey=k;draw();revealKey=null;}
function toggleRival(name){rivalOpen=rivalOpen===name?null:name;reveal(rivalOpen,renderRivals);}
// "24/10/2026" → "24 Oct"
function shortDate(d){const [dd,mm]=d.split('/');return `${+dd} ${MONTHS[+mm-1]}`;}

function renderRivals(){
  const el=document.getElementById('pnl-rivals');
  const back=`<button class="link back" style="margin:0" onclick="goTab('${rivalsFrom}')">${icon('left')}${rivalsFrom==='player'?playerName:'More'}</button>`;
  const top=`<div class="pp-top">${back}</div>`;
  const ss=selSessions(),rv=rivals(ss);
  const ps=playerStats(ss).filter(p=>rv[p.name]);   // only players with at least one rival, by rank
  if(!ps.length){el.innerHTML=top+emptyCard('No two players have shared 3+ sessions in this selection yet.');return;}
  if(!rv[rivalOf]){rivalOf=ps[0].name;rivalOpen=null;}
  const list=rv[rivalOf],maxAbs=Math.max(...list.map(r=>Math.abs(r.avg)),0.01);

  // one player's side of a session: P&L, with in → out underneath
  const cell=v=>`<span class="r"><span class="money ${cls(v.pnl)}" style="display:block">${money(v.pnl)}</span>
    <span class="sub" style="font-size:11px;white-space:nowrap">${gbp(v.buyin)}→${gbp(v.final)}</span></span>`;
  const detail=r=>{
    const sh=sharedSessions(ss,rivalOf,r.opp),tot=sh.reduce((t,x)=>t+x.gap,0),avg=tot/sh.length;
    return `<div class="rv-detail${revealKey===r.opp?' reveal':''}">
      <div class="rd-row head"><span>Session</span><span class="r">${rivalOf}</span><span class="r">${r.opp}</span><span class="r">Gap</span></div>
      ${sh.map(x=>`<div class="rd-row"><span style="min-width:0"><span style="display:block">${x.session.name}</span><span class="sub">${seasonTag(x.session)} · ${shortDate(x.session.date)}</span></span>
        ${cell(x.a)}${cell(x.b)}<span class="money r ${cls(x.gap)}">${money(x.gap)}</span></div>`).join('')}
      <div class="inset rd-sum">Total gap <b class="money ${cls(tot)}">${money(tot)}</b> ÷ ${sh.length} sessions together
        = <b class="money ${cls(avg)}">${money(avg)}</b> a game.
        ${money(avg)!==money25(avg)?` Shown as ${money25(avg)} on the Rivals list (rounded to 25p).`:''}</div></div>`;
  };

  el.innerHTML=top+`<div class="card"><h2 class="h2">Rival analysis</h2>
    <p class="note" style="margin-bottom:12px">For every session two players both played, take the gap between their results (P&amp;L). The average gap is the number on the Rivals list. Pairs need 3+ sessions together. Tap a rival to see the working.</p>
    <div class="pchips" style="margin-top:0">${ps.map(p=>{const on=p.name===rivalOf;
      return `<button class="pchip${on?' on':''}" style="--c:${lineCol(p.name)}" aria-pressed="${on}" onclick="pickRivalOf('${q(p.name)}')"><span class="dot"></span>${p.name}</button>`;}).join('')}</div></div>
  <div class="card plist">${list.map(r=>{const open=r.opp===rivalOpen,w=Math.abs(r.avg)/maxAbs*50,c=cls(round25(r.avg));
    return `<button class="rv-row x" aria-expanded="${open}" onclick="toggleRival('${q(r.opp)}')">${av(r.opp,32)}
      <span style="min-width:0"><span class="nm">${r.opp}</span><span class="sub" style="display:block">${r.n} games</span></span>
      <span class="st-bar centred"><span class="${c}" style="${r.avg>=0?'left':'right'}:50%;width:${w}%"></span></span>
      <span class="money r ${c}" style="font-size:15px">${money25(r.avg)}</span><span class="chev">${icon(open?'open':'right')}</span></button>
      ${open?detail(r):''}`;}).join('')}</div>`;
}

// ══════════════ AWARDS ══════════════
// Awards come from allAwards() in stats.js (every season, newest first). They always cover every
// season, whatever Chapter / Season is picked. Two places show them: the pop-up from a player page,
// and More → Awards (the Trophy cabinet).
const AWARD_INFO={
  champion:{name:'Champion',              rule:'Top of the standings when the season closes', icon:'trophy',  c:'var(--gold)'},
  runnerUp:{name:'Runner-up',             rule:'2nd when the season closes',                  icon:'trophy',  c:'var(--silver)'},
  third:   {name:'Third',                 rule:'3rd when the season closes',                  icon:'trophy',  c:'var(--copper)'},
  loser:   {name:'Loser',                 rule:'Last when the season closes',                 icon:'arrowDown',c:'var(--down)'},
  donation:{name:'Donation of the Season',rule:'Worst single session',                        icon:'coinMinus',c:'var(--down)'},
  fullHouse: {name:'Full House',              rule:'Played every session',                        icon:'house',   c:'#B391E8'},
  comeback:{name:'Comeback of the Season',rule:'Biggest rise, 1st half to 2nd half',          icon:'up',      c:'var(--up)'},
  falloff: {name:'Biggest Fall-off',      rule:'Biggest drop, 1st half to 2nd half',          icon:'down',    c:'var(--down)'},
  whale:   {name:'Whale',                 rule:'Most money bought in',                        icon:'stack',   c:'#7B9BE0'},
};
// The number behind an award, for one player's list ("−£100 in Session 8")
function awardDetail(a,name){
  switch(a.type){
    case 'champion':case 'runnerUp':case 'third':case 'loser':return `${money25(a.value)} ranked average`;
    case 'donation':{const ses=a.donors.filter(d=>d.player===name).map(d=>d.session.name);
      return `${money(a.value)} in ${ses.length?ses.join(' and '):a.donors[0].session.name}`;}
    case 'fullHouse':return `Played all ${a.value} session${a.value!==1?'s':''}`;
    case 'comeback':return `${money25(a.value)} a game better in the second half`;
    case 'falloff':return `${gbp25(-a.value)} a game worse in the second half`;
    case 'whale':return `${gbp(a.value)} bought in across the season`;
  }
}
const awTag=a=>`C${a.chapter} · S${a.season}`;
const awIcon=(type,live)=>`<span class="aw-ic${live?' live':''}${type==='champion'?' champ':''}" style="--c:${AWARD_INFO[type].c}">${icon(AWARD_INFO[type].icon)}</span>`;
const awardsOf=name=>allAwards(DATA).filter(a=>a.players.includes(name));

// One row per award for one player: icon, name, the number behind it, and C1 · S2 or "Leading"
function awardRows(list,name){
  if(!list.length)return `<p class="note empty">No awards yet.</p>`;
  return list.map(a=>{const live=a.status==='leading',others=a.players.filter(p=>p!==name);
    return `<div class="aw-row">${awIcon(a.type,live)}
      <div class="mid"><div class="nm">${AWARD_INFO[a.type].name}</div>
        <div class="sub">${awardDetail(a,name)}${others.length?` · shared with ${others.length>2?others.length+' others':others.join(' and ')}`:''}</div></div>
      <span class="aw-tag${live?' live':''}">${live?'Leading':awTag(a)}</span></div>`;}).join('');
}
// Summary pills: podium finishes by name, everything else as "N other" (locked awards only)
function awardPills(list){
  const won=list.filter(a=>a.status==='locked'),n=t=>won.filter(a=>a.type===t).length;
  const pills=[['champion','Champion','gold'],['runnerUp','Runner-up',''],['third','Third','bronze']]
    .filter(([t])=>n(t)).map(([t,l,c])=>`<span class="aw-pill ${c}">${n(t)} ${l}</span>`);
  const other=won.filter(a=>!['champion','runnerUp','third'].includes(a.type)).length;
  if(other)pills.push(`<span class="aw-pill muted">${other} other</span>`);
  return pills.length?`<div class="aw-pills">${pills.join('')}</div>`:'';
}
const wonInPlay=list=>{const w=list.filter(a=>a.status==='locked').length;return `${w} won · ${list.length-w} in play`;};
// Small Art Deco corner for the pop-up
const DECO=`<svg class="deco" viewBox="0 0 24 24" aria-hidden="true"><path d="M1 23V1h22M5 23V5h18M9 23V9" fill="none" stroke="var(--copper)" stroke-width="1" opacity=".7"/></svg>`;

// ── Player awards pop-up ──
let awReturn=null;   // element to give focus back to when the pop-up closes
function openAwards(name){
  const list=awardsOf(name);
  const bg=document.createElement('div');bg.className='modal-bg';bg.id='aw-modal';
  bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="aw-title">${DECO}
    <div class="modal-head">${av(name,52)}<div style="min-width:0"><h2 class="title" id="aw-title">${name}’s awards</h2>
      <div class="sub" style="font-size:14px;margin-top:6px">${wonInPlay(list)}</div></div>
      <button class="x" aria-label="Close" onclick="closeAwards()">${icon('x')}</button></div>
    <div class="modal-body">${awardPills(list)}${awardRows(list,name)}</div></div>`;
  bg.addEventListener('click',e=>{if(e.target===bg)closeAwards();});   // tap outside the panel to close
  awReturn=document.activeElement;
  document.body.appendChild(bg);document.body.style.overflow='hidden';
  document.addEventListener('keydown',awEsc);
  bg.querySelector('.x').focus();
}
function awEsc(e){if(e.key==='Escape')closeAwards();}
function closeAwards(){
  document.getElementById('aw-modal')?.remove();document.body.style.overflow='';
  document.removeEventListener('keydown',awEsc);awReturn?.focus();
}

// ── Trophy cabinet (More → Awards) ──
let cabinetView='award';                 // 'award' | 'player'
let cabinetOpen=new Set(['champion']);   // expanded cards (award types or player names)
function toggleCabinet(k){const opening=!cabinetOpen.has(k);opening?cabinetOpen.add(k):cabinetOpen.delete(k);reveal(opening?k:null,renderAwards);}
function setCabinetView(v){cabinetView=v;renderAwards();}
// Winner names for a row: avatar + name for each
const winners=a=>a.players.map(p=>`<span class="nm1">${av(p,26)}${p}</span>`).join('');

function renderAwards(){
  const el=document.getElementById('pnl-awards');
  const all=allAwards(DATA);
  let html=`<button class="link back" onclick="goTab('more')">${icon('left')}More</button>
    <h1 class="title" style="font-size:clamp(26px,8vw,36px)">Trophy cabinet</h1>
    <p class="sub" style="font-size:14px;margin-top:8px">Awards lock in when a season closes. Live seasons show who’s leading.</p>
    <div class="seg big" role="tablist"><button class="${cabinetView==='award'?'on':''}" aria-pressed="${cabinetView==='award'}" onclick="setCabinetView('award')">By award</button>
      <button class="${cabinetView==='player'?'on':''}" aria-pressed="${cabinetView==='player'}" onclick="setCabinetView('player')">By player</button></div>`;

  if(cabinetView==='award'){
    html+=AWARD_TYPES.map(t=>{
      const list=all.filter(a=>a.type===t),open=cabinetOpen.has(t);
      // collapsed: the latest locked winner (or the current leader if none is locked yet)
      const latest=list.find(a=>a.status==='locked')||list[0];
      const side=latest&&!open?`<span class="aw-latest"><span class="sub">${latest.status==='leading'?'Leading':awTag(latest)}</span>
        <b>${latest.players[0]}${latest.players.length>1?` +${latest.players.length-1}`:''}</b></span>`:'';
      return `<div class="card aw-card"><button class="aw-head" aria-expanded="${open}" onclick="toggleCabinet('${t}')">${awIcon(t)}
        <span class="mid"><span class="nm" style="display:block">${AWARD_INFO[t].name}</span><span class="sub">${AWARD_INFO[t].rule}</span></span>
        ${side}<span class="sub">${icon(open?'up-chev':'open')}</span></button>
        ${open?`<div class="aw-list${revealKey===t?' reveal':''}">${list.length?list.map(a=>`<div class="aw-season"><span class="tagtxt">${awTag(a)}</span>
          <span class="names">${winners(a)}</span>${a.status==='leading'?'<span class="aw-tag live">Leading</span>':''}</div>`).join('')
          :'<p class="note empty">Not won yet.</p>'}</div>`:''}</div>`;}).join('');
  }else{
    // everyone with an award: most Champions first, then Runner-ups, then Thirds, then most awards won
    const names=[...new Set(all.flatMap(a=>a.players))].map(n=>{const l=all.filter(a=>a.players.includes(n));
      const won=l.filter(a=>a.status==='locked'),k=t=>won.filter(a=>a.type===t).length;
      return {n,l,key:[k('champion'),k('runnerUp'),k('third'),won.length]};})
      .sort((a,b)=>{for(let i=0;i<a.key.length;i++)if(a.key[i]!==b.key[i])return b.key[i]-a.key[i];return a.n.localeCompare(b.n);});
    html+=names.map(({n,l})=>{const open=cabinetOpen.has('p:'+n);
      return `<div class="card aw-card"><button class="aw-head" aria-expanded="${open}" onclick="toggleCabinet('p:${q(n)}')">${av(n,44)}
        <span class="mid"><span class="nm" style="display:block">${n}</span><span class="sub">${wonInPlay(l)}</span></span>
        <span class="sub">${icon(open?'up-chev':'open')}</span></button>
        ${open?`<div class="aw-list${revealKey==='p:'+n?' reveal':''}">${awardPills(l)}${awardRows(l,n)}</div>`:''}</div>`;}).join('');
  }
  el.innerHTML=html;
}

// ══════════════ HOUSE RULES ══════════════
// More → House rules: optional rules we can play with, one card per rule. Rules with a stake
// (stake:true) get a £ input; "{stake}" in their text shows the amount and updates as you type.
// Stakes start at 50p and only live on this page (not saved): they're agreed on the night.
const HOUSE_STAKES={sevenTwo:.5,squid:.5,threeRow:.5,bomb:.5};

// Icons, 24×24, drawn in the card's colour (flags use their own colours)
const HOUSE_ICONS={
  sevenTwo:`<rect x="2.5" y="5" width="10" height="14" rx="2" transform="rotate(-8 7.5 12)"/><rect x="11.5" y="5" width="10" height="14" rx="2" transform="rotate(8 16.5 12)"/>
    <text x="7.3" y="15.2" font-size="8.5" font-weight="800" text-anchor="middle" fill="currentColor" stroke="none" font-family="var(--display)">7</text>
    <text x="16.7" y="15.2" font-size="8.5" font-weight="800" text-anchor="middle" fill="currentColor" stroke="none" font-family="var(--display)">2</text>`,
  squid:`<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 1.5v5M12 17.5v5M1.5 12h5M17.5 12h5"/>`,
  threeRow:`<path d="M9 3v18M15 3v18M3 9h18M3 15h18"/><path d="M4 20 20 4" stroke-width="2.6"/>`,
  pineapple:`<path d="M8 9c-2.5 0-4 2.5-4 6s1.5 6.5 4 6.5 4-3 4-6.5-1.5-6-4-6Z"/><path d="M5.5 13.5l5 4M10.5 13.5l-5 4"/><path d="M8 9 6 4.5M8 9l0-5M8 9l2-4.5"/>
    <path d="M14 9h7l-1 12.5h-5Z"/><path d="M14 12h7"/>`,
  courchevel:`<rect x="1" y="5" width="7.4" height="14" fill="#2E59B5" stroke="none"/><rect x="8.3" y="5" width="7.4" height="14" fill="#ECE6DA" stroke="none"/><rect x="15.6" y="5" width="7.4" height="14" fill="#B23B37" stroke="none"/>`,
  omaha:`<rect x="1" y="5" width="22" height="14" fill="#ECE6DA" stroke="none"/><path d="M1 6h22M1 10h22M1 14h22M1 18h22" stroke="#B23B37" stroke-width="2" stroke-linecap="butt"/><rect x="1" y="5" width="10" height="7.6" fill="#2E59B5" stroke="none"/>`,
  bomb:`<circle cx="10" cy="14" r="7"/><rect x="13.4" y="6.6" width="3.6" height="3" rx=".6" transform="rotate(45 15.2 8.1)"/><path d="M6.6 12.6a3.6 3.6 0 0 1 2.6-2.6"/>
    <path d="M16.6 6.4c.7-1.7 2.2-2.4 3.6-1.8"/><path d="M21.4 1.6v1.6M23 3.4h-1.6M20 2.2l.7.7"/>`,
  double:`<text x="12" y="16.5" font-size="12" font-weight="800" text-anchor="middle" fill="currentColor" stroke="none" font-family="var(--display)">×2</text>`,
};
// Copy is exactly as written; **…** marks a variant name to show in bold.
const HOUSE_RULES=[
  {id:'sevenTwo',name:'7–2 Game',c:'var(--gold)',stake:true,lines:[
    'Win a hand holding 7–2 (suited counts), by any means, and show it. Everyone pays you {stake}.']},
  {id:'squid',name:'Squid Game',c:'var(--down)',stake:true,lines:[
    'When announced, put dice in play: one fewer than the number of players.',
    'Play as normal. Whoever wins a hand takes a dice.',
    'You can only hold one. If you already have one, nothing is taken.',
    'A split pot doesn’t win a dice.',
    'When the dice run out, the player without one pays everyone {stake}.']},
  {id:'threeRow',name:'Three in a Row',c:'var(--up)',stake:true,lines:[
    'Win three hands in a row (split pots count). Everyone pays you {stake}.']},
  {id:'pineapple',name:'Pineapple & Irish',c:'#C9B458',lines:[
    'Extra cards, then discard down to two. Everything else plays as normal.'],more:[
    '**Pineapple:** dealt 3. Bet preflop, then discard one before the flop.',
    '**Crazy Pineapple:** dealt 3. See the flop, then discard one.',
    '**Lazy Pineapple:** dealt 3. Keep all three to the end, then discard one before showdown.',
    '**Irish:** dealt 4. Bet preflop and on the flop, then discard two before the turn.']},
  {id:'courchevel',name:'Courchevel',c:'var(--muted)',lines:[
    'One flop card is dealt face-up before preflop betting.',
    'The other two flop cards come as normal.']},
  {id:'omaha',name:'Omaha',c:'var(--muted)',lines:[
    'Dealt 4 cards.',
    'You must use exactly two of them with exactly three from the board.']},
  {id:'bomb',name:'Bomb Pot',c:'var(--copper)',stake:true,lines:[
    'When announced, everyone puts {stake} in the pot.',
    'No preflop betting: deal straight to the flop.',
    'Betting starts on the flop as normal.',
    '**Pineapple Bomb:** everyone is dealt 3 and discards one after seeing the flop.']},
  {id:'double',name:'Double Board',c:'#7B9BE0',lines:[
    'Two boards are dealt instead of one.',
    'Each board wins half the pot.',
    'Your best hand on each board counts separately.',
    'Works well as a Bomb Pot.']},
];
let houseOpen=new Set();   // expanded cards (the ones with more to show)

// One line of copy: bold "Name:" prefix, and the live stake in place of {stake}
function houseLine(t,id){
  t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  return `<li>${t.replace('{stake}',`<strong class="stk-${id}">${gbp(HOUSE_STAKES[id])}</strong>`)}</li>`;
}
// Typing a stake updates the amount in that card's text without redrawing (so the input keeps focus)
function setStake(id,v){
  HOUSE_STAKES[id]=Math.max(0,parseFloat(v)||0);
  document.querySelectorAll('.stk-'+id).forEach(e=>{e.textContent=gbp(HOUSE_STAKES[id]);});
}
function toggleHouse(id){const opening=!houseOpen.has(id);opening?houseOpen.add(id):houseOpen.delete(id);reveal(opening?id:null,renderHouse);}

function renderHouse(){
  document.getElementById('pnl-house').innerHTML=`<button class="link back" onclick="goTab('more')">${icon('left')}More</button>
    <h1 class="title" style="font-size:clamp(26px,8vw,36px)">House rules</h1>
    <p class="sub" style="font-size:14px;margin:8px 0 18px">Optional extras we can play with. Stakes are agreed on the night.</p>
    ${HOUSE_RULES.map(r=>{const open=houseOpen.has(r.id);
      const head=`${`<span class="aw-ic" style="--c:${r.c}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true">${HOUSE_ICONS[r.id]}</svg></span>`}
        <h2 class="hr-name">${r.name}</h2>${r.more?`<span class="sub" style="margin-left:auto">${icon(open?'up-chev':'open')}</span>`:''}`;
      return `<div class="card hr-card">
        ${r.more?`<button class="hr-head" aria-expanded="${open}" onclick="toggleHouse('${r.id}')">${head}</button>`:`<div class="hr-head">${head}</div>`}
        <ul class="hr-lines">${r.lines.map(t=>houseLine(t,r.id)).join('')}${open&&r.more?r.more.map(t=>houseLine(t,r.id).replace('<li>',revealKey===r.id?'<li class="reveal">':'<li>')).join(''):''}</ul>
        ${r.more&&!open?`<button class="link" style="font-size:13px;margin-top:8px" onclick="toggleHouse('${r.id}')">Show the ${r.more.length} variants</button>`:''}
        ${r.stake?`<label class="hr-stake">Stake <span class="hr-input">£<input type="number" min="0" step="0.5" inputmode="decimal" value="${HOUSE_STAKES[r.id].toFixed(2)}" oninput="setStake('${r.id}',this.value)" aria-label="${r.name} stake in pounds"></span></label>`:''}
      </div>`;}).join('')}`;
}

// ══════════════ RULES ══════════════
function renderRules(){
  const el=document.getElementById('pnl-rules');
  let html=`<button class="link back" onclick="goTab(rulesFrom)">${icon('left')}${rulesFrom==='lb'?'Table':'More'}</button>`;
  html+=`<div class="card"><h2 class="h2">How scoring works</h2>
      <p class="prose">Your score for a session is simply <strong>final chips − total buy-in</strong>. Win money, score positive. Lose money, score negative.</p></div>
    <div class="card"><h2 class="h2">The standings</h2>
      <p class="prose">Ranked by <strong>total PnL ÷ (sessions played + ${K})</strong>.</p>
      <div class="inset prose" style="margin-top:12px">Everyone is treated as though they'd also played ${K} break-even sessions. Play once and those ${K} imaginary sessions dominate, so you sit near £0. Play the whole season and they barely matter. This stops someone winning big on their debut and topping the table above a season-long grinder.</div>
      <div class="inset prose"><strong>Example.</strong> +£348.25 across 10 sessions → 348.25 ÷ 13 = <strong>+£26.79</strong>. One session of <span style="white-space:nowrap">−£20</span> → −20 ÷ 4 = <strong>−£5</strong>.</div></div>
    <div class="card"><h2 class="h2">Buy-ins and rebuys</h2>
      <p class="prose">Everyone starts with <strong>£20</strong>. If you bust, rebuy for any amount between <strong>£20</strong> and the <strong>largest stack at the table</strong>.</p>
      <div class="inset prose" style="margin-top:12px;font-size:13px">Buying in for more than the biggest stack is pointless: the excess can never be won or lost. The table sets the limit; no house rule needed.</div></div>`;
  el.innerHTML=html;
}

startWhenDbReady();
</script>
